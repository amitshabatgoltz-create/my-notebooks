<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>סרטון: מבלגן לסדר 3D – המחברות שלי</title>
<link rel="icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800;900&family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E0E12;--ink:#F2F2F6;--muted:#9A9AA6;--line:#2A2A33;--accent:#8E8CFF}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Rubik',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px;gap:14px}
h1{font-size:22px;margin:0}
p{margin:0;color:var(--muted);text-align:center;max-width:560px;font-size:15px;line-height:1.6}
canvas{height:min(72vh,900px);width:auto;max-width:100%;aspect-ratio:9/16;border-radius:22px;box-shadow:0 20px 60px -20px rgba(0,0,0,.8);background:#000}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button,a.btn{font:inherit;font-weight:700;font-size:15px;border:none;border-radius:999px;padding:11px 20px;cursor:pointer;text-decoration:none}
.p{background:linear-gradient(135deg,#5E5CE6,#FF5E8A);color:#fff}
.g{background:#1E1E26;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
#st{min-height:1.6em;color:var(--accent);font-weight:600}
a.back{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<a class="back" href="./">חזרה לחומרי הפרסום</a>
<h1>סרטון: מבלגן לסדר, תלת-ממד (20 שניות)</h1>
<p>מוכן לטיקטוק, לריילס ולשורטס: מסך לאורך, עם מוזיקה. לוחצים "יצירת הסרטון", מחכים 20 שניות, והוא יורד למחשב.</p>
<canvas id="cv" width="1080" height="1920"></canvas>
<div class="row"><button class="g" id="play">ניגון</button><button class="p" id="rec">יצירת הסרטון והורדה</button></div>
<div id="st" role="status"></div>
<div id="dl" class="row"></div>

<script>
const W = 1080, H = 1920, DUR = 20, BEAT = 0.5;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const qrImg = new Image(); qrImg.src = 'qr.svg';
const P = s => new Path2D(s);
const IC = {
  book: [P('M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5z'), P('M4 21.5A2.5 2.5 0 0 1 6.5 19H20v3H6.5')],
  cam: [P('M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z'), P('M15.5 13a3.5 3.5 0 1 1-7 0a3.5 3.5 0 1 1 7 0z')],
  spark: [P('M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z')],
  cards: [P('M5.5 7h9A2.5 2.5 0 0 1 17 9.5v9a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 3 18.5v-9A2.5 2.5 0 0 1 5.5 7z'), P('M7 3.5h11.5A2.5 2.5 0 0 1 21 6v11.5')],
  chat: [P('M21 12a8.5 8.5 0 0 1-8.5 8.5c-1.5 0-2.9-.4-4.1-1L3 21l1.5-5.2A8.5 8.5 0 1 1 21 12z')],
  check: [P('M5 12.5l4.5 4.5L19 7.5')],
};
// ---------- עזרים ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const prog = (t, a, d) => clamp((t - a) / d);
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIn = x => x * x * x;
const eBack = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
function rnd(seed) { let s = seed * 9301 + 49297; return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function icon(name, cx, cy, size, color, lw = 2) {
  ctx.save(); ctx.translate(cx - size / 2, cy - size / 2); ctx.scale(size / 24, size / 24);
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  IC[name].forEach(p => ctx.stroke(p)); ctx.restore();
}
function font(size, w = 800, fam = 'Rubik') { ctx.font = `${w} ${size}px "${fam}"`; }
// מילה שקופצת פנימה (עם קפיצה קטנה), אפשר עם מרקר מאחוריה
function pop(str, x, y, size, t0, t, o = {}) {
  const k = prog(t, t0, .38); if (k <= 0) return 0;
  const s = lerp(.35, 1, eBack(k)), a = clamp(k * 3);
  font(size, o.w || 900, o.fam); ctx.direction = 'rtl'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const tw = ctx.measureText(str).width;
  ctx.save(); ctx.translate(x, y); ctx.rotate((o.rot || 0) * (1 - eOut(k))); ctx.scale(s, s); ctx.globalAlpha *= a;
  if (o.mark) {
    const m = eOut(prog(t, t0 + .18, .3));
    ctx.fillStyle = o.mark; ctx.beginPath(); ctx.roundRect(tw / 2 + 18 - (tw + 36) * m, -size * .42, (tw + 36) * m, size * .9, 14); ctx.fill();
  }
  if (o.shadow) { ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10; }
  ctx.fillStyle = o.color || '#fff'; ctx.fillText(str, 0, 4);
  ctx.restore(); return tw;
}
function confetti(t, t0, cx, cy, n, seed) {
  const dt = t - t0; if (dt < 0 || dt > 2.6) return;
  const r = rnd(seed), cols = ['#FFE45C', '#FF5E8A', '#8E8CFF', '#2EC4B6', '#ffffff', '#FFA347'];
  for (let i = 0; i < n; i++) {
    const ang = r() * Math.PI * 2, sp = 500 + r() * 1300, vx = Math.cos(ang) * sp, vy = Math.sin(ang) * sp - 700;
    const x = cx + vx * dt * .9, y = cy + vy * dt + 1500 * dt * dt, rot = r() * 6 + dt * (r() * 14 - 7);
    ctx.save(); ctx.globalAlpha = clamp(1.6 - dt * .7); ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = cols[i % cols.length];
    ctx.fillRect(-9, -15, 18, 30 * (.5 + .5 * Math.abs(Math.sin(dt * 9 + i)))); ctx.restore();
  }
}
function grad(c1, c2, ang = .6) {
  const g = ctx.createLinearGradient(W * (.5 - ang), 0, W * (.5 + ang), H); g.addColorStop(0, c1); g.addColorStop(1, c2); return g;
}
const beatPulse = t => Math.pow(1 - ((t % BEAT) / BEAT), 4);

// ---------- הלוח ----------
const BOARD = ['מלכים א׳ פרק א׳', '• התוכנית של נתן ובת־שבע', '• יא׳–יב׳: אדוניהו ממליך את עצמו', '• ודוד לא יודע מכך'];
function board(x, y, w, h, t, reveal) {
  ctx.save();
  rr(x - 18, y - 18, w + 36, h + 36, 26); ctx.fillStyle = '#8A5A35'; ctx.fill();
  rr(x, y, w, h, 12); const g = ctx.createLinearGradient(x, y, x + w, y + h); g.addColorStop(0, '#24453A'); g.addColorStop(1, '#16302A'); ctx.fillStyle = g; ctx.fill();
  ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,.04)'; for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.ellipse(x + w * (.15 + i * .15), y + h * (.3 + (i % 3) * .2), 160, 40, .3, 0, 7); ctx.fill(); }
  ctx.direction = 'rtl'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  BOARD.forEach((s, i) => {
    const k = reveal === undefined ? 1 : eOut(prog(reveal, .25 + i * .42, .45)); if (k <= 0) return;
    font(i ? h * .1 : h * .15, 700, 'Amatic SC');
    const tw = ctx.measureText(s).width, ly = y + h * (.17 + i * .215) + (i ? 6 : 0), rx = x + w - w * .07;
    ctx.save(); ctx.beginPath(); ctx.rect(rx - tw * k - 8, ly - h * .12, tw * k + 16, h * .24); ctx.clip();
    ctx.fillStyle = 'rgba(246,246,236,.93)'; ctx.fillText(s, rx, ly);
    if (!i) { ctx.strokeStyle = 'rgba(246,246,236,.7)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(rx, ly + h * .09); ctx.lineTo(rx - tw, ly + h * .09); ctx.stroke(); }
    ctx.restore();
  });
  ctx.restore();
}
// ---------- טלפון ----------
function phone(cx, cy, w, rot, sc, drawScreen) {
  const h = w * 2.05;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); ctx.scale(sc, sc);
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 80; ctx.shadowOffsetY = 40;
  rr(-w / 2, -h / 2, w, h, w * .14); ctx.fillStyle = '#111116'; ctx.fill();
  ctx.shadowColor = 'transparent';
  const bz = w * .035; rr(-w / 2 + bz, -h / 2 + bz, w - bz * 2, h - bz * 2, w * .11); ctx.save(); ctx.clip();
  ctx.translate(-w / 2 + bz, -h / 2 + bz); drawScreen(w - bz * 2, h - bz * 2); ctx.restore();
  rr(-w * .14, -h / 2 + bz + 14, w * .28, 34, 17); ctx.fillStyle = '#111116'; ctx.fill();
  ctx.restore();
}
function appTop(sw, title) {
  ctx.fillStyle = '#FBFBFD'; ctx.fillRect(0, 0, sw, 2000);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, sw, 150);
  rr(sw - 98, 72, 56, 56, 16); ctx.fillStyle = '#5E5CE6'; ctx.fill(); icon('book', sw - 70, 100, 34, '#fff', 2.2);
  font(34, 800); ctx.direction = 'rtl'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#1D1D1F'; ctx.fillText(title, sw - 118, 102);
  ctx.fillStyle = '#E7E7EE'; ctx.fillRect(0, 150, sw, 2);
}

// ---------- הסצנות ----------
function sceneA(t) {        // 0–3: הלוח מלא
  const z = 1 + t * .03;
  ctx.fillStyle = '#0B0B10'; ctx.fillRect(0, 0, W, H);
  const v = ctx.createRadialGradient(W / 2, 700, 100, W / 2, 700, 1100); v.addColorStop(0, 'rgba(94,92,230,.22)'); v.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(W / 2, 760); ctx.scale(z, z); ctx.rotate(-.02); board(-470, -330, 940, 640, t, t); ctx.restore();
  pop('סוף השיעור.', W / 2, 1330, 128, .15, t, { shadow: 1 });
  pop('הלוח', W / 2 + 205, 1500, 150, 1.45, t, { color: '#0B0B10', mark: '#FFE45C', rot: -.15 });
  pop('מלא.', W / 2 - 195, 1500, 150, 1.75, t, { rot: .15 });
  pop('ואין זמן להעתיק', W / 2, 1670, 66, 2.2, t, { w: 700, color: '#B9B9C6' });
}
function sceneB(t, T) {     // 3–6.5: לוחצים ומצלמים
  const p = beatPulse(T);
  ctx.fillStyle = grad('#4D4BD8', '#B24DD6'); ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = .12 + p * .08; ctx.fillStyle = '#fff';
  for (let i = 0; i < 9; i++) { ctx.beginPath(); ctx.arc(W / 2, 1050, 240 + i * 150 + (T * 120 % 150), 0, 7); ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; ctx.stroke(); }
  ctx.globalAlpha = 1;
  const k = eBack(prog(t, 0, .55)), py = lerp(1900, 1080, k);
  const flash = prog(t, 2.25, .08) * (1 - prog(t, 2.33, .35));
  const sh = flash > 0 ? Math.sin(T * 90) * 14 * flash : 0;
  phone(W / 2 + sh, py, 600, lerp(.12, -.04, k), 1, (sw, shh) => {
    if (t < 1.25) {
      appTop(sw, 'תנ"ך');
      ctx.fillStyle = '#E7E7EE'; for (let i = 0; i < 5; i++) { rr(40, 230 + i * 70, sw - 80 - (i % 2) * 120, 22, 11); ctx.fill(); }
      const tap = prog(t, .85, .3), bs = 1 - Math.sin(tap * Math.PI) * .07;
      ctx.save(); ctx.translate(sw / 2, 760); ctx.scale(bs, bs);
      rr(-230, -66, 460, 132, 66); const g = ctx.createLinearGradient(-230, 0, 230, 0); g.addColorStop(0, '#5E5CE6'); g.addColorStop(1, '#8E5CF0'); ctx.fillStyle = g;
      ctx.shadowColor = 'rgba(94,92,230,.5)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 14; ctx.fill(); ctx.shadowColor = 'transparent';
      icon('cam', 150, 0, 54, '#fff', 2.2);
      font(42, 800); ctx.fillStyle = '#fff'; ctx.direction = 'rtl'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('תמונה לטקסט', -30, 3);
      ctx.restore();
      if (tap > 0 && tap < 1) { ctx.globalAlpha = 1 - tap; ctx.beginPath(); ctx.arc(sw / 2 + 60, 770, 40 + tap * 220, 0, 7); ctx.fillStyle = 'rgba(94,92,230,.35)'; ctx.fill(); ctx.globalAlpha = 1; }
      if (t > .6 && t < 1.2) { const f = eOut(prog(t, .6, .25)); ctx.globalAlpha = f; ctx.beginPath(); ctx.arc(sw / 2 + 60, lerp(980, 780, f), 46, 0, 7); ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.stroke(); ctx.globalAlpha = 1; }
    } else {
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, sw, shh);
      const zz = 1 + prog(t, 1.25, 1) * .08;
      ctx.save(); ctx.translate(sw / 2, shh / 2 - 40); ctx.scale(zz, zz); board(-250, -170, 500, 340, t, 9); ctx.restore();
      const c = eOut(prog(t, 1.35, .4)), L = 70, m = lerp(110, 60, c);
      ctx.strokeStyle = '#FFE45C'; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.globalAlpha = c;
      [[m, shh / 2 - 260, 1, 1], [sw - m, shh / 2 - 260, -1, 1], [m, shh / 2 + 180, 1, -1], [sw - m, shh / 2 + 180, -1, -1]].forEach(([x, y, dx, dy]) => { ctx.beginPath(); ctx.moveTo(x, y + L * dy); ctx.lineTo(x, y); ctx.lineTo(x + L * dx, y); ctx.stroke(); });
      ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.arc(sw / 2, shh - 150, 58, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.beginPath(); ctx.arc(sw / 2, shh - 150, 74, 0, 7); ctx.stroke();
    }
  });
  pop('לוחצים.', W / 2, 250, 120, .25, t, { shadow: 1 });
  pop('מצלמים.', W / 2, 400, 120, 1.25, t, { color: '#2A1A55', mark: '#FFE45C', rot: .12 });
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash})`; ctx.fillRect(0, 0, W, H); }
}
const NOTE = BOARD.map(s => s.replace('• ', ''));
function sceneC(t, T) {     // 6.5–10.5: מוקלד
  ctx.fillStyle = grad('#FF5E8A', '#7B5CF0'); ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = .18; ctx.fillStyle = '#fff';
  const r = rnd(7); for (let i = 0; i < 40; i++) { const x = r() * W, y = (r() * H + T * (80 + r() * 160)) % H; ctx.beginPath(); ctx.arc(x, y, 3 + r() * 6, 0, 7); ctx.fill(); }
  ctx.restore();
  const z = lerp(1.18, 1, eOut(prog(t, 0, .5))) + prog(t, .5, 3.5) * .05;
  phone(W / 2, 1175, 600, -.03, z, (sw, shh) => {
    appTop(sw, 'תנ"ך');
    ctx.strokeStyle = '#E3E2F7'; ctx.lineWidth = 2; for (let y = 268; y < shh; y += 64) { ctx.beginPath(); ctx.moveTo(30, y); ctx.lineTo(sw - 30, y); ctx.stroke(); }
    const total = NOTE.join('').length, typed = Math.floor(prog(t, .25, 1.7) * total);
    let left = typed;
    ctx.direction = 'rtl'; ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
    NOTE.forEach((s, i) => {
      const n = clamp(left, 0, s.length); left -= s.length; if (n <= 0 && i) return;
      const part = s.slice(0, n), y = i ? 324 + i * 64 + 40 : 250, x = sw - 44 - (i ? 30 : 0);
      font(i ? 30 : 50, i ? 500 : 800); ctx.fillStyle = i ? '#2B2B33' : '#1D1D1F'; ctx.fillText(part, x, y);
      if (i) { ctx.beginPath(); ctx.arc(sw - 52, y - 11, 6, 0, 7); ctx.fillStyle = '#5E5CE6'; ctx.fill(); }
      if (n < s.length && n > 0 || (n === 0 && !i)) { const cw = ctx.measureText(part).width; if ((T * 4 | 0) % 2 === 0) { ctx.fillStyle = '#5E5CE6'; ctx.fillRect(x - cw - 8, y - 38, 4, 46); } }
    });
    const ck = eBack(prog(t, 2.05, .4));
    if (ck > 0) { ctx.save(); ctx.translate(sw / 2, shh - 330); ctx.scale(ck, ck); ctx.beginPath(); ctx.arc(0, 0, 80, 0, 7); ctx.fillStyle = '#16A34A'; ctx.fill(); icon('check', 0, 0, 90, '#fff', 3.2); ctx.restore(); }
  });
  confetti(t, 2.05, W / 2, 1420, 70, 3);
  pop('מוקלד.', W / 2, 220, 150, 2.1, t, { color: '#3A1550', mark: '#FFE45C', rot: -.12, shadow: 0 });
  pop('בשתי שניות.', W / 2, 370, 100, 2.5, t, { shadow: 1 });
}
const FEATS = [['spark', 'סיכום למבחן', 'מכל המחברת, בלחיצה', '#9B4DE0'], ['cards', 'כרטיסיות שינון', 'מהחומר שלך', '#E09B0B'], ['chat', 'עוזר לימודי', 'מסביר כל שלב', '#2EC4B6']];
function sceneD(t, T) {     // 10.5–14.5: עוד דברים
  ctx.fillStyle = '#F5F5FA'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#DCDCE8'; for (let x = 30; x < W; x += 60) for (let y = 30; y < H; y += 60) { ctx.beginPath(); ctx.arc(x, y, 3.2, 0, 7); ctx.fill(); }
  pop('ויש עוד.', W / 2, 330, 130, .1, t, { color: '#1D1D1F' });
  FEATS.forEach(([ic, a, b, c], i) => {
    const t0 = .55 + i * .5, k = prog(t, t0, .42); if (k <= 0) return;
    const dir = i % 2 ? -1 : 1, x = lerp(W * 1.2 * dir, 0, eBack(k)) + W / 2, y = 700 + i * 330;
    const lift = Math.sin(clamp((t - t0 - .5) * 2.5) * Math.PI) * 8;
    if (k < 1) { ctx.globalAlpha = .25 * (1 - k); ctx.fillStyle = c; for (let j = 0; j < 4; j++) ctx.fillRect(x + dir * (420 + j * 70), y - 70 + j * 40, 160, 10); ctx.globalAlpha = 1; }
    ctx.save(); ctx.translate(x, y - lift); ctx.rotate((1 - eOut(k)) * .2 * dir);
    ctx.shadowColor = 'rgba(30,30,60,.18)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 20;
    rr(-430, -130, 860, 260, 46); ctx.fillStyle = '#fff'; ctx.fill(); ctx.shadowColor = 'transparent';
    rr(250, -70, 140, 140, 36); ctx.fillStyle = c; ctx.fill(); icon(ic, 320, 0, 74, '#fff', 2.2);
    ctx.direction = 'rtl'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    font(64, 800); ctx.fillStyle = '#1D1D1F'; ctx.fillText(a, 210, -28);
    font(42, 500); ctx.fillStyle = '#6E6E78'; ctx.fillText(b, 210, 46);
    ctx.restore();
  });
  pop('הכול במקום אחד', W / 2, 1720, 84, 2.5, t, { color: '#fff', mark: '#5E5CE6' });
}
function sceneE(t, T) {     // 14.5–18: הלוגו
  ctx.fillStyle = grad('#5E5CE6', '#FF5E8A', .4); ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(W / 2, 760); ctx.rotate(T * .25); ctx.globalAlpha = .1;
  for (let i = 0; i < 16; i++) { ctx.rotate(Math.PI / 8); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(1600, -120); ctx.lineTo(1600, 120); ctx.closePath(); ctx.fillStyle = '#fff'; ctx.fill(); }
  ctx.restore();
  const k = eBack(prog(t, .05, .5)), pb = 1 + beatPulse(T) * .04;
  ctx.save(); ctx.translate(W / 2, 700); ctx.scale(k * pb, k * pb); ctx.rotate((1 - k) * -.6);
  ctx.shadowColor = 'rgba(40,0,80,.4)'; ctx.shadowBlur = 70; ctx.shadowOffsetY = 30;
  rr(-150, -150, 300, 300, 80); ctx.fillStyle = '#fff'; ctx.fill(); ctx.shadowColor = 'transparent';
  icon('book', 0, 0, 170, '#5E5CE6', 2.1); ctx.restore();
  confetti(T, 14.6, W / 2, 700, 90, 11);
  pop('המחברות שלי', W / 2, 1010, 132, .45, t, { shadow: 1 });
  pop('מחברות, יומן ועוזר AI לתלמידים', W / 2, 1140, 54, .9, t, { w: 600, color: 'rgba(255,255,255,.92)' });
  const f = eBack(prog(t, 1.35, .4));
  if (f > 0) {
    const wig = Math.sin(T * 10) * .04 * prog(t, 1.75, .2);
    ctx.save(); ctx.translate(W / 2, 1290); ctx.scale(f, f); ctx.rotate(wig - .04);
    rr(-150, -56, 300, 112, 56); ctx.fillStyle = '#FFE45C'; ctx.fill();

    if (b % 4 === 0) KEY[bar].forEach(hz => mar(t, hz / 2, .06));
  }
  // הבלגן: רעד, פיצוץ, התראות
  { const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = noise; s.loop = true; f.type = 'lowpass'; f.frequency.setValueAtTime(200, at + 4.4); f.frequency.exponentialRampToValueAtTime(2500, at + 5); g.gain.setValueAtTime(.001, at + 4.4); g.gain.exponentialRampToValueAtTime(.25, at + 4.98); g.gain.exponentialRampToValueAtTime(.001, at + 5.05); s.connect(f).connect(g).connect(out); s.start(at + 4.4); s.stop(at + 5.1); }
  sub(at + 5, 40, 1.2, .9); nz(at + 5, .6, 'lowpass', 900, .6);
  [5.7, 6.7, 7.7].forEach(c => ding(at + c));
  // הסדר: "קליק" לכל דבר שנכנס
  [10.6, 11.2, 11.8, 12.7, 13.4].forEach((c, i) => { nz(at + c, .02, 'highpass', 3000, .4); mar(at + c + .01, [1046.5, 1174.7, 1318.5, 1568, 1760][i], .15); });
  // הוואו: הקלדה וצליל קסם
  for (let c = 16.6; c < 18.2; c += .1) nz(at + c, .025, 'highpass', 5000, .18);
  [1046.5, 1318.5, 1568, 2093, 2637].forEach((hz, i) => mar(at + 19.6 + i * .06, hz, .14));
  // מחר: הודעה ותשובה
  ding(at + 22.3); [23.7, 24.1].forEach(c => mar(at + c, 1568, .1));
  // סוף
  sub(at + 27, 49, 1, .7); clap(at + 27, .5); [784, 987.8, 1174.7, 1568].forEach((hz, i) => mar(at + 27.05 + i * .08, hz, .16));
  return out;
}

function frame(T) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  const i = SC.findIndex(s => T < s[1]); const [a, , fn] = SC[i < 0 ? SC.length - 1 : i];
  const t = T - a, cut = i > 0 ? prog(T, a, .32) : 1;

  fn(t, T); ctx.restore(); softLight();
  if (cut < 1) { ctx.fillStyle = `rgba(255,255,255,${.75 * (1 - eOut(cut))})`; ctx.fillRect(0, 0, W, H); }
  // פס התקדמות קטן למעלה
  ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(0, 0, W, 8); ctx.fillStyle = '#FFE45C'; ctx.fillRect(W - W * (T / DUR), 0, W * (T / DUR), 8);
}

// ---------- מוזיקה (נוצרת בדפדפן) ----------
let ac = null, dest = null;
function music(at) {
  ac = ac || new AudioContext(); dest = dest || ac.createMediaStreamDestination();
  const out = ac.createGain(); out.gain.value = .55; out.connect(ac.destination); out.connect(dest);
  const noise = (() => { const b = ac.createBuffer(1, ac.sampleRate, ac.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; })();
  const kick = (t, v = 1) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + .18); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + .4); o.connect(g).connect(out); o.start(t); o.stop(t + .45); };
  const hat = (t, v = .18) => { const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = noise; f.type = 'highpass'; f.frequency.value = 7500; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + .06); s.connect(f).connect(g).connect(out); s.start(t); s.stop(t + .08); };
  const snap = (t, v = .45) => { const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = noise; f.type = 'bandpass'; f.frequency.value = 1800; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + .16); s.connect(f).connect(g).connect(out); s.start(t); s.stop(t + .2); };
  const whoosh = t => { const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = noise; f.type = 'bandpass'; f.Q.value = 1.2; f.frequency.setValueAtTime(300, t - .35); f.frequency.exponentialRampToValueAtTime(5000, t + .05); g.gain.setValueAtTime(.001, t - .35); g.gain.exponentialRampToValueAtTime(.5, t); g.gain.exponentialRampToValueAtTime(.001, t + .2); s.connect(f).connect(g).connect(out); s.start(t - .35); s.stop(t + .25); };
  const bass = (t, hz, d) => { const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain(); o.type = 'sawtooth'; o.frequency.value = hz; f.type = 'lowpass'; f.frequency.value = 520; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.22, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(f).connect(g).connect(out); o.start(t); o.stop(t + d + .05); };
  const pluck = (t, hz) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'triangle'; o.frequency.value = hz; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.16, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + .35); o.connect(g).connect(out); o.start(t); o.stop(t + .4); };
  const ROOT = [55, 55, 43.65, 49], MEL = [659.3, 784, 880, 784, 659.3, 587.3, 523.3, 587.3];
  for (let b = 0; b < DUR / BEAT; b++) {
    const t = at + b * BEAT, T = b * BEAT;
    if (T < 2.8) { if (b % 2 === 0) kick(t, .7); continue; }          // התחלה שקטה
    kick(t); hat(t + BEAT / 2); if (T >= 6) hat(t + BEAT / 4, .1);
    if (b % 2 === 1) snap(t);
    bass(t, ROOT[Math.floor(b / 4) % 4], .42);
    if (T >= 6 && T < 16) pluck(t + BEAT / 2, MEL[b % 8]);
  }
  [2.8, 6, 9.5, 12.5, 16].forEach(c => whoosh(at + c));
  kick(at + 9.5, 1.3); snap(at + 9.5, .8); kick(at + 16, 1.2);                                // הלוגו
  // "קליק" של מצלמה
  snap(at + 5.05, .9); hat(at + 5.1, .5);
  return out;
}

// ---------- ניגון והקלטה ----------
let run = 0;
function play(rec) {
  const id = ++run, start = performance.now();
  const tick = () => {
    if (id !== run) return;
    const T = (performance.now() - start) / 1000;
    frame(Math.min(T, DUR));
    if (T < DUR + .15) requestAnimationFrame(tick); else if (rec) rec();
  };
  requestAnimationFrame(tick);
}
const st = document.getElementById('st');
document.getElementById('play').onclick = async () => { await ready; const g = music((ac && ac.currentTime || 0) + .05); play(() => {}); setTimeout(() => g.disconnect(), DUR * 1000 + 600); };
document.getElementById('rec').onclick = async () => {
  await ready; const btns = [...document.querySelectorAll('button')]; btns.forEach(b => b.disabled = true);
  ac = ac || new AudioContext(); await ac.resume();
  const g = music(ac.currentTime + .05);
  const types = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'];
  const type = types.find(x => window.MediaRecorder && MediaRecorder.isTypeSupported(x)) || '';
  const stream = new MediaStream([...cv.captureStream(30).getVideoTracks(), ...dest.stream.getAudioTracks()]);
  const mr = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 10e6 }), parts = [];
  mr.ondataavailable = e => e.data.size && parts.push(e.data);
  mr.onstop = async () => {
    g.disconnect();
    const ext = type.includes('mp4') ? 'mp4' : 'webm', blob = new Blob(parts, { type: type.split(';')[0] || 'video/webm' });
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = 'המחברות-שלי-3D.' + ext; a.className = 'btn p'; a.textContent = 'הורדה שוב';
    document.getElementById('dl').replaceChildren(a); if (!new URLSearchParams(location.search).get('save')) a.click();
    st.textContent = ext === 'mp4' ? 'הסרטון ירד ✓ (MP4)' : 'הסרטון ירד ✓ (WEBM: אם האפליקציה לא מקבלת, להמיר ל-MP4 באתר המרה)';
    btns.forEach(b => b.disabled = false);
    const save = new URLSearchParams(location.search).get('save');
    if (save && /^http:\/\/(127\.0\.0\.1|localhost):\d+\//.test(save)) fetch(save + '?ext=' + ext, { method: 'POST', body: blob }).then(() => { st.textContent += ' · נשמר'; }).catch(() => {});
  };
  st.textContent = 'מקליט... 18 שניות'; mr.start(250);

};
const ready = Promise.all([document.fonts.load('900 100px "Rubik"'), document.fonts.load('800 100px "Rubik"'), document.fonts.load('500 100px "Rubik"'), document.fonts.load('700 100px "Amatic SC"'), new Promise(r => { if (qrImg.complete) r(); else { qrImg.onload = r; qrImg.onerror = r; } })]).catch(() => {});
ready.then(() => frame(16.5));
