<p>מוכן לטיקטוק, לריילס ולשורטס: מסך לאורך, עם מוזיקה. לוחצים "יצירת הסרטון", מחכים 18 שניות, והוא יורד למחשב.</p>

<script>
const W = 1080, H = 1920, DUR = 18, BEAT = 0.5;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const qrImg = new Image(); qrImg.src = 'qr.svg';
const P = s => new Path2D(s);
const IC = {
  book: [P('M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5z'), P('M4 21.5A2.5 2.5 0 0 1 6.5 19H20v3H6.5')],
  cam: [P('M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z'), P('M15.5 13a3.5 3.5 0 1 1-7 0a3.5 3.5 0 1 1 7 0z')],
  spark: [P('M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z')],
  cards: [P('M5.5 7h9A2.5 2.5 0 0 1 17 9.5v9a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 3 18.5v-9A2.5 2.5 0 0 1 5.5 7z'), P('M7 3.5h11.5A2.5 2.5 0 0 1 21 6v11.5')],
  chat: [P('M21 12a8.5 8.5 0 0 1-8.5 8.5c-1.5 0-2.9-.4-4.1-1L3 21l1.5-5.2A8.5 8.5 0 1 1 21 12z')],
  check: [P('M5 12.5l4.5 4.5L19 7.5')],

// ---------- עזרים ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const prog = (t, a, d) => clamp((t - a) / d);
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIn = x => x * x * x;
const eBack = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
function rnd(seed) { let s = seed * 9301 + 49297; return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }

}
function font(size, w = 800, fam = 'Rubik') { ctx.font = `${w} ${size}px "${fam}"`; }

function pop(str, x, y, size, t0, t, o = {}) {

  font(size, o.w || 900, o.fam); ctx.direction = 'rtl'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const tw = ctx.measureText(str).width;
  ctx.save(); ctx.translate(x, y); ctx.rotate((o.rot || 0) * (1 - eOut(k))); ctx.scale(s, s); ctx.globalAlpha *= a;

    const m = eOut(prog(t, t0 + .18, .3));

  ctx.fillStyle = o.color || '#fff'; ctx.fillText(str, 0, 4);
  ctx.restore(); return tw;
}
function confetti(t, t0, cx, cy, n, seed) {
  const dt = t - t0; if (dt < 0 || dt > 2.6) return;
  const r = rnd(seed), cols = ['#FFE45C', '#FF5E8A', '#8E8CFF', '#2EC4B6', '#ffffff', '#FFA347'];
  for (let i = 0; i < n; i++) {
    const ang = r() * Math.PI * 2, sp = 500 + r() * 1300, vx = Math.cos(ang) * sp, vy = Math.sin(ang) * sp - 700;

    ctx.save(); ctx.globalAlpha = clamp(1.6 - dt * .7); ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = cols[i % cols.length];

  }
}
function grad(c1, c2, ang = .6) {
  const g = ctx.createLinearGradient(W * (.5 - ang), 0, W * (.5 + ang), H); g.addColorStop(0, c1); g.addColorStop(1, c2); return g;
}
const beatPulse = t => Math.pow(1 - ((t % BEAT) / BEAT), 4);

// ---------- טלפון ----------
function phone(cx, cy, w, rot, sc, drawScreen) {
  const h = w * 2.05;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); ctx.scale(sc, sc);
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 80; ctx.shadowOffsetY = 40;

  ctx.translate(-w / 2 + bz, -h / 2 + bz); drawScreen(w - bz * 2, h - bz * 2); ctx.restore();

  ctx.restore();
}
// ---------- סרטון 2: העוזר הלימודי ----------
IC.cal = [P('M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z'), P('M16 2v4M8 2v4M3 10h18')];
// שורה בעברית עם משוואה באמצע: מציירים כל חלק לבד, כדי שהסדר יהיה נכון (הקנבס הופך מספרים בעברית)
function fillMixed(str, rx, y) {
  const segs = []; let ltr = false, cur = '';
  for (const ch of str) { if (ch === '‭' || ch === '‬') { if (cur) segs.push([cur, ltr]); cur = ''; ltr = ch === '‭'; } else cur += ch; }
  if (cur) segs.push([cur, ltr]);
  const a = ctx.textAlign, d = ctx.direction; let x = rx; ctx.textAlign = 'right';
  for (const [s, l] of segs) { ctx.direction = l ? 'ltr' : 'rtl'; ctx.fillText(s, x, y); x -= ctx.measureText(s).width; }
  ctx.textAlign = a; ctx.direction = d;
}
function wrap(str, maxW) { const ws = str.split(' '), out = []; let cur = ''; for (const w of ws) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; } if (cur) out.push(cur); return out; }
function chatTop(sw, title) {
  ctx.fillStyle = '#FBFBFD'; ctx.fillRect(0, 0, sw, 2000);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, sw, 150);
  rr(sw - 98, 72, 56, 56, 16); const g = ctx.createLinearGradient(sw - 98, 72, sw - 42, 128); g.addColorStop(0, '#5E5CE6'); g.addColorStop(1, '#FF5E8A'); ctx.fillStyle = g; ctx.fill(); icon('spark', sw - 70, 100, 32, '#fff', 2.2);
  font(34, 800); ctx.direction = 'rtl'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#1D1D1F'; ctx.fillText(title, sw - 118, 102);
  ctx.fillStyle = '#E7E7EE'; ctx.fillRect(0, 150, sw, 2);
}
function inputBar(sw, shh, txt, caret, T) {
  rr(24, shh - 128, sw - 48, 92, 46); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#E2E2EA'; ctx.stroke();
  ctx.beginPath(); ctx.arc(76, shh - 82, 32, 0, 7); const g = ctx.createLinearGradient(44, 0, 108, 0); g.addColorStop(0, '#5E5CE6'); g.addColorStop(1, '#FF5E8A'); ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(90, shh - 82); ctx.lineTo(62, shh - 82); ctx.moveTo(74, shh - 94); ctx.lineTo(62, shh - 82); ctx.lineTo(74, shh - 70); ctx.stroke();
  ctx.direction = 'rtl'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; font(34, 500);
  if (txt) { ctx.fillStyle = '#1D1D1F'; fillMixed(txt, sw - 60, shh - 80); if (caret && (T * 4 | 0) % 2 === 0) { const w = ctx.measureText(txt).width; ctx.fillStyle = '#5E5CE6'; ctx.fillRect(sw - 64 - w, shh - 100, 3, 40); } }
  else { ctx.fillStyle = '#A3A3AF'; ctx.fillText('שואלים כל דבר...', sw - 60, shh - 80); }
}
// בועה של המשתמש (שמאל, סגולה)
function userBubble(sw, y, txt, k) {
  if (k <= 0) return 0; font(38, 500); const lines = wrap(txt, sw * .82), lw = Math.max(...lines.map(l => ctx.measureText(l).width)), bw = lw + 60, bh = lines.length * 54 + 38;
  ctx.save(); ctx.translate(30 + bw, y); ctx.scale(lerp(.6, 1, eBack(k)), lerp(.6, 1, eBack(k))); ctx.globalAlpha = clamp(k * 3);
  rr(-bw, 0, bw, bh, 30); const g = ctx.createLinearGradient(-bw, 0, 0, bh); g.addColorStop(0, '#5E5CE6'); g.addColorStop(1, '#7E5CF0'); ctx.fillStyle = g; ctx.fill();
  ctx.direction = 'rtl'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
  lines.forEach((l, i) => fillMixed(l, -30, 46 + i * 54)); ctx.restore(); return bh;
}
// תשובה של העוזר (ימין, לבנה), נכתבת אות אחרי אות. פריט: [טקסט, סוג] – 't' טקסט, 'eq' משוואה, 'b' מודגש, 'ok' ירוק, 'hint' רמז
function botBubble(sw, y, items, chars, T, dots) {
  const x0 = 26, bw = sw - 52 - 56; let yy = y + 34, left = chars;
  ctx.save();
  ctx.beginPath(); ctx.arc(sw - 52, y + 30, 26, 0, 7); const g = ctx.createLinearGradient(sw - 78, y, sw - 26, y + 56); g.addColorStop(0, '#5E5CE6'); g.addColorStop(1, '#FF5E8A'); ctx.fillStyle = g; ctx.fill(); icon('spark', sw - 52, y + 30, 28, '#fff', 2.2);
  const laid = []; items.forEach(([s, kind]) => { font(kind === 'eq' ? 52 : kind === 'b' ? 37 : 35, kind === 'eq' ? 800 : kind === 'b' ? 700 : 500); wrap(s, bw - (kind === 'hint' ? 90 : 56)).forEach(l => laid.push([l, kind])); });
  const hTot = laid.reduce((a, [, k]) => a + (k === 'eq' ? 78 : k === 'hint' ? 62 : 52), 0) + 40;
  rr(x0, y, bw, dots ? 92 : hTot, 30); ctx.fillStyle = '#fff'; ctx.shadowColor = 'rgba(30,30,60,.08)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 6; ctx.fill(); ctx.shadowColor = 'transparent'; ctx.lineWidth = 2; ctx.strokeStyle = '#ECECF3'; ctx.stroke();
  if (dots) { for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(x0 + bw - 60 - i * 30, y + 46 - Math.max(0, Math.sin(T * 10 - i)) * 10, 9, 0, 7); ctx.fillStyle = '#A3A3AF'; ctx.fill(); } ctx.restore(); return 92; }
  for (const [l, kind] of laid) {
    const n = clamp(left, 0, l.length); left -= l.length; const lh = kind === 'eq' ? 78 : kind === 'hint' ? 62 : 52;
    if (n > 0) {
      const part = l.slice(0, n), rx = x0 + bw - 28;
      if (kind === 'eq') { rr(x0 + 22, yy - 4, bw - 44, 68, 18); ctx.fillStyle = '#EEEEFD'; ctx.fill(); font(52, 800); ctx.fillStyle = '#4B49C8'; ctx.direction = 'ltr'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(part, x0 + bw / 2, yy + 30); }
      else {
        if (kind === 'hint') { font(35, 700); const w = ctx.measureText(l).width; rr(rx - w - 30, yy - 2, w + 40, 54, 27); ctx.fillStyle = '#FFF4C2'; ctx.fill(); }
        font(kind === 'b' ? 37 : 35, kind === 'b' || kind === 'hint' ? 700 : 500); ctx.direction = 'rtl'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        ctx.fillStyle = kind === 'ok' ? '#16A34A' : kind === 'hint' ? '#7A5A00' : '#1D1D1F'; fillMixed(part, rx - (kind === 'hint' ? 10 : 0), yy + 25);

  }

}
const nChars = items => items.reduce((a, [s]) => a + s.length, 0);

function sceneA(t, T) {       // 0–3: תקוע
  ctx.fillStyle = '#0B0B10'; ctx.fillRect(0, 0, W, H);
  const v = ctx.createRadialGradient(W / 2, 760, 80, W / 2, 760, 1000); v.addColorStop(0, 'rgba(255,94,138,.18)'); v.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);

  ctx.save(); ctx.translate(W / 2, 760); ctx.scale(z, z); ctx.rotate(.04);
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 60; ctx.shadowOffsetY = 30; rr(-400, -420, 800, 840, 18); ctx.fillStyle = '#FDFCF6'; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.strokeStyle = '#C9D8F2'; ctx.lineWidth = 3; for (let y = -330; y < 420; y += 72) { ctx.beginPath(); ctx.moveTo(-400, y); ctx.lineTo(400, y); ctx.stroke(); }
  ctx.strokeStyle = '#F2A3B0'; ctx.beginPath(); ctx.moveTo(320, -420); ctx.lineTo(320, 420); ctx.stroke();
  ctx.direction = 'ltr'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = '#23356B';
  const L = [['2x + 6 = 14', -230, 0], ['2x = 20', -86, .55], ['x = ?', 58, 1.1]];
  L.forEach(([s, y, d]) => { const k = eOut(prog(t, .1 + d, .45)); if (k <= 0) return; font(y === -230 ? 120 : 104, 700, 'Amatic SC'); const w = ctx.measureText(s).width; ctx.save(); ctx.beginPath(); ctx.rect(-w / 2 - 10, y - 110, (w + 20) * k, 140); ctx.clip(); ctx.fillText(s, 0, y); ctx.restore(); });
  const sk = eOut(prog(t, .95, .25)); if (sk > 0) { ctx.strokeStyle = '#E5484D'; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-170, -118); ctx.lineTo(-170 + 340 * sk, -118 - 20 * sk); ctx.stroke(); }
  ctx.restore();

const Q1 = 'איך פותרים ‭2x + 6 = 14‬?';
const A1 = [['בוא נפתור שלב אחרי שלב:', 'b'], ['1. מורידים 6 משני הצדדים:', 't'], ['2x = 8', 'eq'], ['2. מחלקים ב-2:', 't'], ['x = 4', 'eq'], ['בדיקה: ‭2·4 + 6 = 14‬ ✓', 'ok']];
function sceneB(t, T) {       // 3–7.5: שואלים, והוא מסביר
  const p = beatPulse(T);
  ctx.fillStyle = grad('#4D4BD8', '#B24DD6'); ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = .1 + p * .08; ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; for (let i = 0; i < 9; i++) { ctx.beginPath(); ctx.arc(W / 2, 1150, 240 + i * 150 + (T * 120 % 150), 0, 7); ctx.stroke(); } ctx.globalAlpha = 1;

    if (t >= 1.85) { const dots = t < 2.2; botBubble(sw, 200 + ub + 30, A1, Math.floor(prog(t, 2.2, 1.9) * nChars(A1)), T, dots); }
  });

}
const Q2 = 'תפתור לי: ‭3x − 5 = 10‬';
const A2 = [['את התשובה תמצא לבד, אני רק עוזר:', 'b'], ['מה צריך לעשות כדי ש-‭3x‬ יישאר לבד בצד אחד?', 't'], ['רמז: מה מבטל מינוס?', 'hint']];
function sceneC(t, T) {       // 7.5–11: מצב מורה
  ctx.fillStyle = grad('#FF5E8A', '#7B5CF0'); ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = .18; ctx.fillStyle = '#fff'; const r = rnd(9); for (let i = 0; i < 40; i++) { const x = r() * W, y = (r() * H + T * (80 + r() * 160)) % H; ctx.beginPath(); ctx.arc(x, y, 3 + r() * 6, 0, 7); ctx.fill(); } ctx.restore();

    // הצ'יפ "מצב מורה"
    const on = eOut(prog(t, .55, .3)), cy = 200;
    ctx.save(); const pulse = 1 + Math.sin(clamp((t - .55) / .3) * Math.PI) * .08; ctx.translate(sw / 2, cy + 30); ctx.scale(pulse, pulse);
    rr(-150, -32, 300, 64, 32); ctx.fillStyle = on > .5 ? '#5E5CE6' : '#EEEEF4'; ctx.fill();
    rr(-130, -15, 56, 30, 15); ctx.fillStyle = on > .5 ? 'rgba(255,255,255,.35)' : '#D5D5DF'; ctx.fill();
    ctx.beginPath(); ctx.arc(lerp(-115, -89, on), 0, 12, 0, 7); ctx.fillStyle = '#fff'; ctx.fill();
    font(30, 700); ctx.direction = 'rtl'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillStyle = on > .5 ? '#fff' : '#3A3A44'; ctx.fillText('מצב מורה', 120, 2);
    ctx.restore();
    if (t > .35 && t < .9) { const f = eOut(prog(t, .35, .25)); ctx.globalAlpha = f * (1 - prog(t, .7, .2)); ctx.beginPath(); ctx.arc(sw / 2 - 90, lerp(420, cy + 40, f), 40, 0, 7); ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.stroke(); ctx.globalAlpha = 1; }
    inputBar(sw, shh, '', false, T);
    const ub = userBubble(sw, 300, Q2, prog(t, 1.0, .35));
    if (t >= 1.3) botBubble(sw, 300 + ub + 30, A2, Math.floor(prog(t, 1.6, 1.4) * nChars(A2)), T, t < 1.6);
  });
  pop('רוצה ללמוד באמת?', W / 2, 220, 100, .2, t, { shadow: 1 });
  pop('מצב מורה: רק רמזים.', W / 2, 370, 86, 1.9, t, { color: '#3A1550', mark: '#FFE45C', rot: -.1 });
}
const CAP = [['check', 'בודק שיעורי בית', 'מסמן ✓ ו-✕ ומסביר מה לתקן', '#16A34A'], ['cards', 'בוחן אותך', 'שאלון קצר לפני מבחן', '#E09B0B'], ['cal', 'מוסיף ליומן', '"יש לי מבחן ביום שני" וזה בפנים', '#5E5CE6'], ['cam', 'מבין צילומים', 'מצלמים תרגיל ושואלים', '#FF5E8A']];
function sceneD(t, T) {       // 11–14.5: מה עוד
  ctx.fillStyle = '#F5F5FA'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#DCDCE8'; for (let x = 30; x < W; x += 60) for (let y = 30; y < H; y += 60) { ctx.beginPath(); ctx.arc(x, y, 3.2, 0, 7); ctx.fill(); }
  pop('והוא גם:', W / 2, 300, 130, .1, t, { color: '#1D1D1F' });

    const dir = i % 2 ? -1 : 1, x = lerp(W * 1.2 * dir, 0, eBack(k)) + W / 2, y = 580 + i * 270;
    if (k < 1) { ctx.globalAlpha = .25 * (1 - k); ctx.fillStyle = c; for (let j = 0; j < 4; j++) ctx.fillRect(x + dir * (420 + j * 70), y - 60 + j * 34, 160, 10); ctx.globalAlpha = 1; }

    rr(-440, -110, 880, 220, 44); ctx.fillStyle = '#fff'; ctx.fill(); ctx.shadowColor = 'transparent';
    rr(270, -62, 124, 124, 34); ctx.fillStyle = c; ctx.fill(); icon(ic, 332, 0, 66, '#fff', 2.3);
    ctx.direction = 'rtl'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    font(58, 800); ctx.fillStyle = '#1D1D1F'; ctx.fillText(a, 236, -26);
    font(38, 500); ctx.fillStyle = '#6E6E78'; ctx.fillText(b, 236, 40);
    ctx.restore();
  });
  pop('כל מקצוע. כל שאלה.', W / 2, 1720, 84, 2.4, t, { color: '#1D1D1F', mark: '#FFE45C' });
}
function sceneE(t, T) {       // 14.5–18: סיום
  ctx.fillStyle = grad('#5E5CE6', '#FF5E8A', .4); ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(W / 2, 700); ctx.rotate(-T * .25); ctx.globalAlpha = .1;
  for (let i = 0; i < 16; i++) { ctx.rotate(Math.PI / 8); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(1600, -120); ctx.lineTo(1600, 120); ctx.closePath(); ctx.fillStyle = '#fff'; ctx.fill(); }
  ctx.restore();
  const k = eBack(prog(t, .05, .5)), pb = 1 + beatPulse(T) * .04;
  ctx.save(); ctx.translate(W / 2, 680); ctx.scale(k * pb, k * pb); ctx.rotate((1 - k) * .6);
  ctx.shadowColor = 'rgba(40,0,80,.4)'; ctx.shadowBlur = 70; ctx.shadowOffsetY = 30;
  rr(-150, -150, 300, 300, 80); ctx.fillStyle = '#fff'; ctx.fill(); ctx.shadowColor = 'transparent';
  icon('spark', 0, 0, 170, '#9B4DE0', 2); ctx.restore();
  confetti(T, 14.6, W / 2, 680, 90, 21);
  pop('העוזר הלימודי', W / 2, 990, 124, .45, t, { shadow: 1 });
  pop('של המחברות שלי', W / 2, 1115, 64, .85, t, { w: 700, color: 'rgba(255,255,255,.92)' });
  const f = eBack(prog(t, 1.3, .4));
  if (f > 0) { const wig = Math.sin(T * 10) * .04 * prog(t, 1.7, .2); ctx.save(); ctx.translate(W / 2, 1270); ctx.scale(f, f); ctx.rotate(wig - .04); rr(-150, -56, 300, 112, 56); ctx.fillStyle = '#FFE45C'; ctx.fill(); font(64, 900); ctx.fillStyle = '#2A1A55'; ctx.direction = 'rtl'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('בחינם', 0, 4); ctx.restore(); }
  const q = eOut(prog(t, 1.75, .45));
  if (q > 0) {
    ctx.save(); ctx.globalAlpha = q; ctx.translate(0, (1 - q) * 60);
    rr(W / 2 - 330, 1460, 660, 250, 40); ctx.fillStyle = 'rgba(255,255,255,.96)'; ctx.fill();
    if (qrImg.complete && qrImg.naturalWidth) ctx.drawImage(qrImg, W / 2 + 90, 1480, 210, 210);
    ctx.direction = 'rtl'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    font(54, 900); ctx.fillStyle = '#1D1D1F'; ctx.fillText('סורקים', W / 2 + 50, 1545); ctx.fillText('ושואלים', W / 2 + 50, 1610);
    font(32, 600); ctx.fillStyle = '#6E6E78'; ctx.fillText('או: קישור בביו', W / 2 + 50, 1670);

}
const SC = [[0, 3, sceneA], [3, 7.5, sceneB], [7.5, 11, sceneC], [11, 14.5, sceneD], [14.5, 18.2, sceneE]];

function frame(T) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  const i = SC.findIndex(s => T < s[1]); const [a, , fn] = SC[i < 0 ? SC.length - 1 : i];
  const t = T - a, cut = i > 0 ? prog(T, a, .32) : 1;
  // מעבר: זום-פאנץ' + סיבוב קטן + הבזק
  ctx.save();
  if (cut < 1) { const s = lerp(1.35, 1, eOut(cut)), r = lerp(i % 2 ? .08 : -.08, 0, eOut(cut)); ctx.translate(W / 2, H / 2); ctx.rotate(r); ctx.scale(s, s); ctx.translate(-W / 2, -H / 2); }
  fn(t, T); ctx.restore();
  if (cut < 1) { ctx.fillStyle = `rgba(255,255,255,${.75 * (1 - eOut(cut))})`; ctx.fillRect(0, 0, W, H); }
  // פס התקדמות קטן למעלה
  ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(0, 0, W, 8); ctx.fillStyle = '#FFE45C'; ctx.fillRect(W - W * (T / DUR), 0, W * (T / DUR), 8);
}

// ---------- מוזיקה (נוצרת בדפדפן) ----------
let ac = null, dest = null;
function music(at) {
  ac = ac || new AudioContext(); dest = dest || ac.createMediaStreamDestination();
  const out = ac.createGain(); out.gain.value = .55; out.connect(ac.destination); out.connect(dest);
  const noise = (() => { const b = ac.createBuffer(1, ac.sampleRate, ac.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; })();
  const kick = (t, v = 1) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + .18); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + .4); o.connect(g).connect(out); o.start(t); o.stop(t + .45); };
  const hat = (t, v = .18) => { const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = noise; f.type = 'highpass'; f.frequency.value = 7500; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + .06); s.connect(f).connect(g).connect(out); s.start(t); s.stop(t + .08); };
  const snap = (t, v = .45) => { const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = noise; f.type = 'bandpass'; f.frequency.value = 1800; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + .16); s.connect(f).connect(g).connect(out); s.start(t); s.stop(t + .2); };
  const whoosh = t => { const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = noise; f.type = 'bandpass'; f.Q.value = 1.2; f.frequency.setValueAtTime(300, t - .35); f.frequency.exponentialRampToValueAtTime(5000, t + .05); g.gain.setValueAtTime(.001, t - .35); g.gain.exponentialRampToValueAtTime(.5, t); g.gain.exponentialRampToValueAtTime(.001, t + .2); s.connect(f).connect(g).connect(out); s.start(t - .35); s.stop(t + .25); };
  const bass = (t, hz, d) => { const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain(); o.type = 'sawtooth'; o.frequency.value = hz; f.type = 'lowpass'; f.frequency.value = 520; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.22, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(f).connect(g).connect(out); o.start(t); o.stop(t + d + .05); };
  const pluck = (t, hz) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'triangle'; o.frequency.value = hz; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.16, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + .35); o.connect(g).connect(out); o.start(t); o.stop(t + .4); };
  const ROOT = [49, 49, 41.2, 55], MEL = [523.3, 659.3, 784, 659.3, 698.5, 880, 784, 659.3];
  for (let b = 0; b < DUR / BEAT; b++) {
    const t = at + b * BEAT, T = b * BEAT;
    if (T < 3) { if (b % 2 === 0) kick(t, .7); continue; }          // התחלה שקטה
    kick(t); hat(t + BEAT / 2); if (T >= 7.5) hat(t + BEAT / 4, .1);
    if (b % 2 === 1) snap(t);
    bass(t, ROOT[Math.floor(b / 4) % 4], .42);
    if (T >= 3 && T < 14.5) pluck(t + BEAT / 2, MEL[b % 8]);
  }
  [3, 7.5, 11, 14.5].forEach(c => whoosh(at + c));
  kick(at + 14.5, 1.3); snap(at + 14.5, .8);                                // הלוגו
  // "קליק" של מצלמה
  snap(at + 8.05, .7);                                                      // מצב מורה נדלק
  return out;
}

// ---------- ניגון והקלטה ----------
let run = 0;
function play(rec) {
  const id = ++run, start = performance.now();
  const tick = () => {
    if (id !== run) return;
    const T = (performance.now() - start) / 1000;
    frame(Math.min(T, DUR));
    if (T < DUR + .15) requestAnimationFrame(tick); else if (rec) rec();
  };
  requestAnimationFrame(tick);
}
const st = document.getElementById('st');
document.getElementById('play').onclick = async () => { await ready; const g = music((ac && ac.currentTime || 0) + .05); play(() => {}); setTimeout(() => g.disconnect(), DUR * 1000 + 600); };
document.getElementById('rec').onclick = async () => {
  await ready; const btns = [...document.querySelectorAll('button')]; btns.forEach(b => b.disabled = true);
  ac = ac || new AudioContext(); await ac.resume();
  const g = music(ac.currentTime + .05);
  const types = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'];
  const type = types.find(x => window.MediaRecorder && MediaRecorder.isTypeSupported(x)) || '';
  const stream = new MediaStream([...cv.captureStream(30).getVideoTracks(), ...dest.stream.getAudioTracks()]);
  const mr = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 10e6 }), parts = [];
  mr.ondataavailable = e => e.data.size && parts.push(e.data);
  mr.onstop = async () => {
    g.disconnect();
    const ext = type.includes('mp4') ? 'mp4' : 'webm', blob = new Blob(parts, { type: type.split(';')[0] || 'video/webm' });
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = 'המחברות-שלי-עוזר-לימודי.' + ext; a.className = 'btn p'; a.textContent = 'הורדה שוב';
    document.getElementById('dl').replaceChildren(a); if (!new URLSearchParams(location.search).get('save')) a.click();
    st.textContent = ext === 'mp4' ? 'הסרטון ירד ✓ (MP4)' : 'הסרטון ירד ✓ (WEBM: אם האפליקציה לא מקבלת, להמיר ל-MP4 באתר המרה)';
    btns.forEach(b => b.disabled = false);
    const save = new URLSearchParams(location.search).get('save');
    if (save && /^http:\/\/(127\.0\.0\.1|localhost):\d+\//.test(save)) fetch(save + '?ext=' + ext, { method: 'POST', body: blob }).then(() => { st.textContent += ' · נשמר'; }).catch(() => {});
  };
  st.textContent = 'מקליט... 18 שניות'; mr.start(250);
  play(() => mr.stop());
};
const ready = Promise.all([document.fonts.load('900 100px "Rubik"'), document.fonts.load('800 100px "Rubik"'), document.fonts.load('500 100px "Rubik"'), document.fonts.load('700 100px "Amatic SC"'), new Promise(r => { if (qrImg.complete) r(); else { qrImg.onload = r; qrImg.onerror = r; } })]).catch(() => {});
ready.then(() => frame(16.5));
