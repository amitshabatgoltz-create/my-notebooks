<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">

<link rel="icon" href="../favicon.ico">

<style>

<body>
<a class="back" href="./">חזרה לחומרי הפרסום</a>
<h1>סרטון: המחברות (18 שניות)</h1>
<p>מוכן לטיקטוק, לריילס ולשורטס: מסך לאורך, עם מוזיקה. לוחצים "יצירת הסרטון", מחכים 18 שניות, והוא יורד למחשב.</p>
<canvas id="cv" width="1080" height="1920"></canvas>
<div class="row"><button class="g" id="play">ניגון</button><button class="p" id="rec">יצירת הסרטון והורדה</button></div>
<div id="st" role="status"></div>
<div id="dl" class="row"></div>

<script>
const W = 1080, H = 1920, DUR = 18, BEAT = 0.5;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const qrImg = new Image(); qrImg.src = 'qr.svg';
const P = s => new Path2D(s);
const IC = {
  book: [P('M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5z'), P('M4 21.5A2.5 2.5 0 0 1 6.5 19H20v3H6.5')],
  cam: [P('M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z'), P('M15.5 13a3.5 3.5 0 1 1-7 0a3.5 3.5 0 1 1 7 0z')],
  spark: [P('M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z')],
  cards: [P('M5.5 7h9A2.5 2.5 0 0 1 17 9.5v9a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 3 18.5v-9A2.5 2.5 0 0 1 5.5 7z'), P('M7 3.5h11.5A2.5 2.5 0 0 1 21 6v11.5')],
  chat: [P('M21 12a8.5 8.5 0 0 1-8.5 8.5c-1.5 0-2.9-.4-4.1-1L3 21l1.5-5.2A8.5 8.5 0 1 1 21 12z')],
  check: [P('M5 12.5l4.5 4.5L19 7.5')],
};
// ---------- עזרים ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const prog = (t, a, d) => clamp((t - a) / d);
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIn = x => x * x * x;
const eBack = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
function rnd(seed) { let s = seed * 9301 + 49297; return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function icon(name, cx, cy, size, color, lw = 2) {
  ctx.save(); ctx.translate(cx - size / 2, cy - size / 2); ctx.scale(size / 24, size / 24);
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  IC[name].forEach(p => ctx.stroke(p)); ctx.restore();
}
function font(size, w = 800, fam = 'Rubik') { ctx.font = `${w} ${size}px "${fam}"`; }
// מילה שקופצת פנימה (עם קפיצה קטנה), אפשר עם מרקר מאחוריה
function pop(str, x, y, size, t0, t, o = {}) {
  const k = prog(t, t0, .38); if (k <= 0) return 0;
  const s = lerp(.35, 1, eBack(k)), a = clamp(k * 3);
  font(size, o.w || 900, o.fam); ctx.direction = 'rtl'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const tw = ctx.measureText(str).width;
  ctx.save(); ctx.translate(x, y); ctx.rotate((o.rot || 0) * (1 - eOut(k))); ctx.scale(s, s); ctx.globalAlpha *= a;
  if (o.mark) {
    const m = eOut(prog(t, t0 + .18, .3));
    ctx.fillStyle = o.mark; ctx.beginPath(); ctx.roundRect(tw / 2 + 18 - (tw + 36) * m, -size * .42, (tw + 36) * m, size * .9, 14); ctx.fill();
  }
  if (o.shadow) { ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10; }
  ctx.fillStyle = o.color || '#fff'; ctx.fillText(str, 0, 4);
  ctx.restore(); return tw;
}
function confetti(t, t0, cx, cy, n, seed) {
  const dt = t - t0; if (dt < 0 || dt > 2.6) return;
  const r = rnd(seed), cols = ['#FFE45C', '#FF5E8A', '#8E8CFF', '#2EC4B6', '#ffffff', '#FFA347'];
  for (let i = 0; i < n; i++) {
    const ang = r() * Math.PI * 2, sp = 500 + r() * 1300, vx = Math.cos(ang) * sp, vy = Math.sin(ang) * sp - 700;
    const x = cx + vx * dt * .9, y = cy + vy * dt + 1500 * dt * dt, rot = r() * 6 + dt * (r() * 14 - 7);
    ctx.save(); ctx.globalAlpha = clamp(1.6 - dt * .7); ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = cols[i % cols.length];
    ctx.fillRect(-9, -15, 18, 30 * (.5 + .5 * Math.abs(Math.sin(dt * 9 + i)))); ctx.restore();
  }
}
function grad(c1, c2, ang = .6) {
  const g = ctx.createLinearGradient(W * (.5 - ang), 0, W * (.5 + ang), H); g.addColorStop(0, c1); g.addColorStop(1, c2); return g;
}
const beatPulse = t => Math.pow(1 - ((t % BEAT) / BEAT), 4);

// ---------- טלפון ----------
function phone(cx, cy, w, rot, sc, drawScreen) {
  const h = w * 2.05;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); ctx.scale(sc, sc);
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 80; ctx.shadowOffsetY = 40;
  rr(-w / 2, -h / 2, w, h, w * .14); ctx.fillStyle = '#111116'; ctx.fill();
  ctx.shadowColor = 'transparent';
  const bz = w * .035; rr(-w / 2 + bz, -h / 2 + bz, w - bz * 2, h - bz * 2, w * .11); ctx.save(); ctx.clip();
  ctx.translate(-w / 2 + bz, -h / 2 + bz); drawScreen(w - bz * 2, h - bz * 2); ctx.restore();
  rr(-w * .14, -h / 2 + bz + 14, w * .28, 34, 17); ctx.fillStyle = '#111116'; ctx.fill();
  ctx.restore();
}
// ---------- סרטון 3: המחברות ----------
function appTop(sw, title, color) {
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, sw, 2000);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, sw, 150);
  rr(sw - 98, 72, 56, 56, 16); ctx.fillStyle = color || '#5E5CE6'; ctx.fill(); icon('book', sw - 70, 100, 34, '#fff', 2.2);
  font(34, 800); ctx.direction = 'rtl'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#1D1D1F'; ctx.fillText(title, sw - 118, 102);
  ctx.fillStyle = '#E7E7EE'; ctx.fillRect(0, 150, sw, 2);
}
function txt(s, x, y, size, w, color, dir = 'rtl', align = 'right') { font(size, w); ctx.direction = dir; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color; ctx.fillText(s, x, y); return ctx.measureText(s).width; }
function chip(s, x, y, k, bg, fg) {
  if (k <= 0) return; font(40, 800); const w = ctx.measureText(s).width + 56;
  ctx.save(); ctx.translate(x, y); const sc = lerp(.4, 1, eBack(k)); ctx.scale(sc, sc); ctx.globalAlpha = clamp(k * 3);
  rr(-w / 2, -38, w, 76, 38); ctx.fillStyle = bg; ctx.fill(); ctx.fillStyle = fg; ctx.direction = 'rtl'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, 0, 3); ctx.restore();
}
// מחברת נייר
function paperNb(x, y, rot, color, label) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 20;
  rr(-210, -280, 420, 560, 18); ctx.fillStyle = color; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(-210, -280, 40, 560);
  for (let i = 0; i < 9; i++) { ctx.beginPath(); ctx.arc(-190, -240 + i * 60, 12, 0, 7); ctx.fillStyle = '#E6E6EA'; ctx.fill(); }
  rr(-110, -150, 260, 120, 10); ctx.fillStyle = '#FDFCF6'; ctx.fill();
  font(70, 700, 'Amatic SC'); ctx.direction = 'rtl'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#23356B'; ctx.fillText(label, 20, -88);
  ctx.restore();
}
function sceneA(t, T) {       // 0–3: מחברות נייר
  ctx.fillStyle = '#0B0B10'; ctx.fillRect(0, 0, W, H);
  const v = ctx.createRadialGradient(W / 2, 800, 80, W / 2, 800, 1000); v.addColorStop(0, 'rgba(94,92,230,.2)'); v.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  const NB = [['#E5484D', 'מתמטיקה', -150, -.18, .05], ['#2EC4B6', 'היסטוריה', 150, .14, .3], ['#E09B0B', 'אנגלית', 0, -.04, .55]];
  NB.forEach(([c, l, dx, r, d]) => {
    const k = prog(t, d, .5), y = lerp(-500, 820, eOut(k)) + (k >= 1 ? 0 : 0);
    if (k <= 0) return;
    const fall = prog(t, 2.05, .9), fx = dx * (1 + fall * 2.2), fy = y + eIn(fall) * 1400, fr = r + fall * (dx >= 0 ? 1.4 : -1.4);
    ctx.globalAlpha = 1 - fall * .6; paperNb(W / 2 + fx, fy, fr, c, l); ctx.globalAlpha = 1;
  });
  pop('מחברות נייר?', W / 2, 1310, 128, .5, t, { shadow: 1 });
  pop('נקרעות.', W / 2 + 120, 1470, 88, 1.2, t, { color: '#FF8FA8', rot: -.2 });
  pop('נשכחות.', W / 2 - 60, 1580, 88, 1.45, t, { color: '#FFE45C', rot: .15 });
  pop('נאבדות.', W / 2 + 60, 1690, 88, 1.7, t, { color: '#8E8CFF', rot: -.12 });
}
const LIB = [['מתמטיקה', '#5E5CE6', 'משוואות, גרפים'], ['היסטוריה', '#2EC4B6', 'המהפכה התעשייתית'], ['ביולוגיה', '#16A34A', 'התא'], ['אנגלית', '#E09B0B', 'Present Perfect'], ['ספרות', '#FF5E8A', 'שירה עברית'], ['תנ"ך', '#9B4DE0', 'ספר שמות']];
function sceneB(t, T) {       // 3–7: מחברת לכל מקצוע
  ctx.fillStyle = grad('#EEEEFD', '#FFE9F0'); ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(94,92,230,.12)'; for (let x = 30; x < W; x += 60) for (let y = 30; y < H; y += 60) { ctx.beginPath(); ctx.arc(x, y, 3, 0, 7); ctx.fill(); }
  pop('מחברת', W / 2, 200, 120, .1, t, { color: '#1D1D1F' });
  pop('לכל מקצוע.', W / 2, 345, 120, .35, t, { color: '#fff', mark: '#5E5CE6', rot: .1 });
  LIB.forEach(([n, c, sub], i) => {
    const col = i % 2, row = i / 2 | 0, t0 = .7 + i * .22, k = prog(t, t0, .45); if (k <= 0) return;
    const cx = col ? W / 2 - 230 : W / 2 + 230, cy = 620 + row * 400, s = lerp(.3, 1, eBack(k));
    const tap = i === 2 ? prog(t, 3.2, .3) : 0, ts = 1 - Math.sin(tap * Math.PI) * .06;
    ctx.save(); ctx.translate(cx, cy + Math.sin(T * 2 + i) * 6); ctx.scale(s * ts, s * ts); ctx.rotate((1 - eOut(k)) * (col ? .3 : -.3)); ctx.globalAlpha = clamp(k * 3);
    ctx.shadowColor = 'rgba(30,30,60,.16)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 16;
    rr(-200, -160, 400, 320, 34); ctx.fillStyle = '#fff'; ctx.fill(); ctx.shadowColor = 'transparent';
    ctx.save(); rr(-200, -160, 400, 320, 34); ctx.clip(); ctx.fillStyle = c; ctx.fillRect(-200, -160, 400, 22); ctx.restore();
    rr(110, -100, 64, 64, 18); ctx.fillStyle = c; ctx.fill(); icon('book', 142, -68, 38, '#fff', 2.2);
    txt(n, 170, 20, 50, 800, '#1D1D1F'); txt(sub, 170, 78, 30, 500, '#6E6E78');
    ctx.restore();
  });
  const f = prog(t, 2.75, .45);
  if (f > 0 && f < 1.2) { ctx.globalAlpha = clamp(1 - prog(t, 3.45, .3)); ctx.beginPath(); ctx.arc(lerp(W / 2 + 360, W / 2 + 250, eOut(f)), lerp(1500, 1050, eOut(f)), 46, 0, 7); ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.stroke(); ctx.globalAlpha = 1; }
}
function sceneC(t, T) {       // 7–11: כותבים כמו בדוקס
  ctx.fillStyle = grad('#4D4BD8', '#B24DD6'); ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = .1 + beatPulse(T) * .07; ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; for (let i = 0; i < 9; i++) { ctx.beginPath(); ctx.arc(W / 2, 1150, 240 + i * 150 + (T * 120 % 150), 0, 7); ctx.stroke(); } ctx.globalAlpha = 1;
  const z = lerp(1.2, 1, eOut(prog(t, 0, .5)));
  phone(W / 2, 1200, 600, -.02, z, (sw, shh) => {
    appTop(sw, 'ביולוגיה', '#16A34A');
    // סרגל קטן
    rr(24, 172, sw - 48, 64, 18); ctx.fillStyle = '#F5F5FA'; ctx.fill();
    ['B', 'I', 'U'].forEach((b, i) => txt(b, sw - 60 - i * 60, 205, 30, 800, '#3A3A44', 'ltr', 'center'));
    [['#FFE45C', 3], ['#E5484D', 4], ['#5E5CE6', 5]].forEach(([c, i]) => { ctx.beginPath(); ctx.arc(sw - 60 - i * 60, 205, 14, 0, 7); ctx.fillStyle = c; ctx.fill(); });
    const rx = sw - 40;
    // כותרת
    const h = 'התא', hn = Math.ceil(prog(t, .2, .3) * h.length); if (hn) txt(h.slice(0, hn), rx, 300, 62, 800, '#1D1D1F');
    // פסקה + מרקר
    const L1 = 'התא הוא היחידה הבסיסית', L2 = 'של כל יצור חי.', p1 = Math.floor(prog(t, .55, .55) * L1.length), p2 = Math.floor(prog(t, 1.1, .3) * L2.length);
    font(34, 500); const pre = 'התא הוא ', wPre = ctx.measureText(pre).width, wT = ctx.measureText('היחידה הבסיסית').width, mk = eOut(prog(t, 1.45, .35));
    if (mk > 0) { rr(rx - wPre - wT * mk - 6, 350, wT * mk + 12, 50, 8); ctx.fillStyle = 'rgba(255,228,92,.8)'; ctx.fill(); }
    if (p1) txt(L1.slice(0, p1), rx, 376, 34, 500, '#2B2B33'); if (p2) txt(L2.slice(0, p2), rx, 430, 34, 500, '#2B2B33');
    // משימות
    [['לסכם את הפרק', 1.75, 2.25], ['לשנן מושגים', 1.9, 2.5]].forEach(([s, a, done], i) => {
      const k = eBack(prog(t, a, .3)); if (k <= 0) return; const y = 510 + i * 62, dn = prog(t, done, .2);
      ctx.save(); ctx.globalAlpha = clamp(k * 2); ctx.translate((1 - k) * 60, 0);
      rr(rx - 34, y - 17, 34, 34, 9); ctx.fillStyle = dn > .5 ? '#16A34A' : '#fff'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = dn > .5 ? '#16A34A' : '#A3A3AF'; ctx.stroke();
      if (dn > .5) icon('check', rx - 17, y, 30, '#fff', 3.4);
      const w = txt(s, rx - 52, y + 2, 32, 500, dn > .5 ? '#9A9AA6' : '#2B2B33');
      if (dn > 0) { ctx.strokeStyle = '#9A9AA6'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(rx - 52, y + 2); ctx.lineTo(rx - 52 - w * eOut(dn), y + 2); ctx.stroke(); }
      ctx.restore();
    });
    // טבלה
    const tk = eOut(prog(t, 2.6, .4));
    if (tk > 0) {
      ctx.save(); ctx.globalAlpha = tk; ctx.translate(0, (1 - tk) * 60);
      const tx = 40, ty = 660, tw = sw - 80, rh = 64, ROWS = [['מבנה', 'תפקיד'], ['גרעין', 'שליטה בתא'], ['ממברנה', 'הגנה']];
      rr(tx, ty, tw, rh * 3, 16); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#E2E2EA'; ctx.stroke();
      ctx.save(); rr(tx, ty, tw, rh * 3, 16); ctx.clip(); ctx.fillStyle = '#F3F3F7'; ctx.fillRect(tx, ty, tw, rh); ctx.restore();
      ctx.beginPath(); ctx.moveTo(tx + tw / 2, ty); ctx.lineTo(tx + tw / 2, ty + rh * 3); ctx.moveTo(tx, ty + rh); ctx.lineTo(tx + tw, ty + rh); ctx.moveTo(tx, ty + rh * 2); ctx.lineTo(tx + tw, ty + rh * 2); ctx.stroke();
      ROWS.forEach((r, i) => r.forEach((c, j) => txt(c, j ? tx + tw / 2 - 20 : tx + tw - 20, ty + rh * i + rh / 2 + 2, 30, i ? 500 : 800, '#2B2B33')));
      ctx.restore();
    }
    // חברה שעורכת ביחד
    const fk = eBack(prog(t, 3.05, .35));
    if (fk > 0) {
      font(30, 500); const cx = 40 + (sw - 80) / 2 - 20 - ctx.measureText('הגנה').width - 8, cy = 660 + 64 * 2 + 32;
      ctx.save(); ctx.translate(cx, cy); ctx.scale(fk, fk);
      ctx.fillStyle = '#FF5E8A'; ctx.fillRect(-2, -26, 5, 52);
      rr(-4, -64, 104, 40, 12); ctx.fill(); txt('נועה', 48, -43, 26, 800, '#fff', 'rtl', 'center');
      ctx.restore();
    }
  });
  pop('כותבים כמו בדוקס.', W / 2, 200, 108, .15, t, { shadow: 1 });
  chip('מרקר', W / 2 + 330, 345, prog(t, 1.45, .35), '#FFE45C', '#2A1A55');
  chip('משימות', W / 2 + 95, 345, prog(t, 2.0, .35), '#fff', '#16A34A');
  chip('טבלאות', W / 2 - 150, 345, prog(t, 2.6, .35), '#fff', '#5E5CE6');
  chip('ביחד', W / 2 - 360, 345, prog(t, 3.05, .35), '#FF5E8A', '#fff');
}
const LAY = ['עמוד אינסופי', 'דפים', 'שקופיות'];
function sceneD(t, T) {       // 11–14.5: צורה ורקע
  ctx.fillStyle = grad('#FF5E8A', '#7B5CF0'); ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = .18; ctx.fillStyle = '#fff'; const r = rnd(4); for (let i = 0; i < 40; i++) { const x = r() * W, y = (r() * H + T * (80 + r() * 160)) % H; ctx.beginPath(); ctx.arc(x, y, 3 + r() * 6, 0, 7); ctx.fill(); } ctx.restore();
  const st = t < 1.15 ? 0 : t < 2.15 ? 1 : 2, sk = eOut(prog(t, st === 0 ? 0 : st === 1 ? 1.15 : 2.15, .3));
  // בורר למעלה
  const segW = 760, sx0 = W / 2 - segW / 2;
  rr(sx0, 380, segW, 96, 48); ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fill();
  const pos = [2, 1, 0], from = st ? pos[st - 1] : pos[0], cur = lerp(from, pos[st], sk);
  rr(sx0 + 8 + cur * (segW - 16) / 3, 388, (segW - 16) / 3, 80, 40); ctx.fillStyle = '#fff'; ctx.fill();
  LAY.forEach((s, i) => txt(s, sx0 + 8 + pos[i] * (segW - 16) / 3 + (segW - 16) / 6, 430, 34, 800, i === st ? '#5E5CE6' : '#fff', 'rtl', 'center'));
  phone(W / 2, 1230, 560, .02, 1 + Math.sin(sk * Math.PI) * .03, (sw, shh) => {
    ctx.fillStyle = st ? '#ECECF3' : '#fff'; ctx.fillRect(0, 0, sw, shh);
    const lines = (x, y, w, n, gap) => { ctx.fillStyle = '#D9D9E3'; for (let i = 0; i < n; i++) { rr(x + (i % 3 === 2 ? w * .3 : 0), y + i * gap, w * (i % 3 === 2 ? .7 : 1), 14, 7); ctx.fill(); } };
    if (st === 0) {
      ctx.strokeStyle = '#D6D5F2'; ctx.lineWidth = 2; for (let y = 120; y < shh; y += 52) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(sw, y); ctx.stroke(); }
      txt('המהפכה התעשייתית', sw - 40, 90, 40, 800, '#1D1D1F');
      ctx.fillStyle = '#2B2B33'; for (let i = 0; i < 18; i++) { const w = (i % 4 === 3 ? .5 : .85) * (sw - 80); rr(sw - 40 - w, 138 + i * 52, w, 12, 6); ctx.fillStyle = '#B9B9C9'; ctx.fill(); }
    } else if (st === 1) {

        ctx.save(); rr(px, py, pw, ph, 8); ctx.clip(); ctx.strokeStyle = '#E3E2F7'; ctx.lineWidth = 2; for (let x = px; x < px + pw; x += 28) { ctx.beginPath(); ctx.moveTo(x, py); ctx.lineTo(x, py + ph); ctx.stroke(); } for (let y = py; y < py + ph; y += 28) { ctx.beginPath(); ctx.moveTo(px, y); ctx.lineTo(px + pw, y); ctx.stroke(); } ctx.restore();
        lines(px + 34, py + 50, pw - 68, 12, 40); txt(String(p + 1), px + pw / 2, py + ph - 24, 22, 700, '#9A9AA6', 'ltr', 'center'); });
    } else {

        if (!p) { txt('המהפכה', px + pw / 2, py + ph / 2 - 24, 52, 900, '#fff', 'rtl', 'center'); txt('התעשייתית', px + pw / 2, py + ph / 2 + 36, 40, 700, 'rgba(255,255,255,.85)', 'rtl', 'center'); }
        else { txt(p === 1 ? 'מכונת הקיטור' : 'מהכפר לעיר', px + pw - 30, py + 50, 36, 800, '#1D1D1F'); lines(px + 30, py + 96, pw - 60, 4, 34); }
        txt(String(p + 1), px + 24, py + ph - 24, 20, 700, p ? '#9A9AA6' : 'rgba(255,255,255,.7)', 'ltr', 'left'); });
    }
  });
  pop('בוחרים איך היא נראית.', W / 2, 220, 98, .1, t, { shadow: 1 });
  pop('שורות. משבצות. דפים. שקופיות.', W / 2, 1800, 60, 2.6, t, { color: '#3A1550', mark: '#FFE45C' });
}
function sceneE(t, T) {       // 14.5–18: סיום
  ctx.fillStyle = grad('#5E5CE6', '#FF5E8A', .4); ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(W / 2, 700); ctx.rotate(T * .25); ctx.globalAlpha = .1;
  for (let i = 0; i < 16; i++) { ctx.rotate(Math.PI / 8); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(1600, -120); ctx.lineTo(1600, 120); ctx.closePath(); ctx.fillStyle = '#fff'; ctx.fill(); }
  ctx.restore();
  const k = eBack(prog(t, .05, .5)), pb = 1 + beatPulse(T) * .04;
  ctx.save(); ctx.translate(W / 2, 680); ctx.scale(k * pb, k * pb); ctx.rotate((1 - k) * -.6);
  ctx.shadowColor = 'rgba(40,0,80,.4)'; ctx.shadowBlur = 70; ctx.shadowOffsetY = 30;
  rr(-150, -150, 300, 300, 80); ctx.fillStyle = '#fff'; ctx.fill(); ctx.shadowColor = 'transparent';
  icon('book', 0, 0, 170, '#5E5CE6', 2.1); ctx.restore();
  confetti(T, 14.6, W / 2, 680, 90, 31);
  pop('המחברות שלי', W / 2, 990, 132, .45, t, { shadow: 1 });
  pop('נשמר בענן. בטלפון ובמחשב.', W / 2, 1115, 56, .85, t, { w: 700, color: 'rgba(255,255,255,.92)' });
  const f = eBack(prog(t, 1.3, .4));
  if (f > 0) { const wig = Math.sin(T * 10) * .04 * prog(t, 1.7, .2); ctx.save(); ctx.translate(W / 2, 1270); ctx.scale(f, f); ctx.rotate(wig - .04); rr(-150, -56, 300, 112, 56); ctx.fillStyle = '#FFE45C'; ctx.fill(); font(64, 900); ctx.fillStyle = '#2A1A55'; ctx.direction = 'rtl'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('בחינם', 0, 4); ctx.restore(); }

    rr(W / 2 - 330, 1460, 660, 250, 40); ctx.fillStyle = 'rgba(255,255,255,.96)'; ctx.fill();
    if (qrImg.complete && qrImg.naturalWidth) ctx.drawImage(qrImg, W / 2 + 90, 1480, 210, 210);
    ctx.direction = 'rtl'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    font(54, 900); ctx.fillStyle = '#1D1D1F'; ctx.fillText('סורקים', W / 2 + 50, 1545); ctx.fillText('ומתחילים', W / 2 + 50, 1610);
    font(32, 600); ctx.fillStyle = '#6E6E78'; ctx.fillText('או: קישור בביו', W / 2 + 50, 1670);

}
const SC = [[0, 3, sceneA], [3, 7, sceneB], [7, 11, sceneC], [11, 14.5, sceneD], [14.5, 18.2, sceneE]];

function frame(T) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  const i = SC.findIndex(s => T < s[1]); const [a, , fn] = SC[i < 0 ? SC.length - 1 : i];
  const t = T - a, cut = i > 0 ? prog(T, a, .32) : 1;
  // מעבר: זום-פאנץ' + סיבוב קטן + הבזק
  ctx.save();
  if (cut < 1) { const s = lerp(1.35, 1, eOut(cut)), r = lerp(i % 2 ? .08 : -.08, 0, eOut(cut)); ctx.translate(W / 2, H / 2); ctx.rotate(r); ctx.scale(s, s); ctx.translate(-W / 2, -H / 2); }
  fn(t, T); ctx.restore();
  if (cut < 1) { ctx.fillStyle = `rgba(255,255,255,${.75 * (1 - eOut(cut))})`; ctx.fillRect(0, 0, W, H); }
  // פס התקדמות קטן למעלה
  ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(0, 0, W, 8); ctx.fillStyle = '#FFE45C'; ctx.fillRect(W - W * (T / DUR), 0, W * (T / DUR), 8);
}

// ---------- מוזיקה (נוצרת בדפדפן) ----------
let ac = null, dest = null;
function music(at) {
  ac = ac || new AudioContext(); dest = dest || ac.createMediaStreamDestination();
  const out = ac.createGain(); out.gain.value = .55; out.connect(ac.destination); out.connect(dest);
  const noise = (() => { const b = ac.createBuffer(1, ac.sampleRate, ac.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; })();
  const kick = (t, v = 1) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + .18); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + .4); o.connect(g).connect(out); o.start(t); o.stop(t + .45); };
  const hat = (t, v = .18) => { const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = noise; f.type = 'highpass'; f.frequency.value = 7500; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + .06); s.connect(f).connect(g).connect(out); s.start(t); s.stop(t + .08); };
  const snap = (t, v = .45) => { const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = noise; f.type = 'bandpass'; f.frequency.value = 1800; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + .16); s.connect(f).connect(g).connect(out); s.start(t); s.stop(t + .2); };
  const whoosh = t => { const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = noise; f.type = 'bandpass'; f.Q.value = 1.2; f.frequency.setValueAtTime(300, t - .35); f.frequency.exponentialRampToValueAtTime(5000, t + .05); g.gain.setValueAtTime(.001, t - .35); g.gain.exponentialRampToValueAtTime(.5, t); g.gain.exponentialRampToValueAtTime(.001, t + .2); s.connect(f).connect(g).connect(out); s.start(t - .35); s.stop(t + .25); };
  const bass = (t, hz, d) => { const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain(); o.type = 'sawtooth'; o.frequency.value = hz; f.type = 'lowpass'; f.frequency.value = 520; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.22, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(f).connect(g).connect(out); o.start(t); o.stop(t + d + .05); };
  const pluck = (t, hz) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'triangle'; o.frequency.value = hz; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.16, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + .35); o.connect(g).connect(out); o.start(t); o.stop(t + .4); };
  const ROOT = [55, 43.65, 49, 41.2], MEL = [880, 784, 659.3, 784, 880, 987.8, 880, 784];
  for (let b = 0; b < DUR / BEAT; b++) {
    const t = at + b * BEAT, T = b * BEAT;
    if (T < 3) { if (b % 2 === 0) kick(t, .7); continue; }          // התחלה שקטה
    kick(t); hat(t + BEAT / 2); if (T >= 7) hat(t + BEAT / 4, .1);
    if (b % 2 === 1) snap(t);
    bass(t, ROOT[Math.floor(b / 4) % 4], .42);
    if (T >= 3 && T < 14.5) pluck(t + BEAT / 2, MEL[b % 8]);
  }
  [3, 7, 11, 14.5].forEach(c => whoosh(at + c));
  kick(at + 14.5, 1.3); snap(at + 14.5, .8);                                // הלוגו
  // "קליק" של מצלמה
  [12.15, 13.15].forEach(c => snap(at + c, .6));                            // החלפת צורה

}

// ---------- ניגון והקלטה ----------
let run = 0;
function play(rec) {
  const id = ++run, start = performance.now();
  const tick = () => {
    if (id !== run) return;
    const T = (performance.now() - start) / 1000;
    frame(Math.min(T, DUR));
    if (T < DUR + .15) requestAnimationFrame(tick); else if (rec) rec();
  };

}
const st = document.getElementById('st');
document.getElementById('play').onclick = async () => { await ready; const g = music((ac && ac.currentTime || 0) + .05); play(() => {}); setTimeout(() => g.disconnect(), DUR * 1000 + 600); };
document.getElementById('rec').onclick = async () => {
  await ready; const btns = [...document.querySelectorAll('button')]; btns.forEach(b => b.disabled = true);
  ac = ac || new AudioContext(); await ac.resume();
  const g = music(ac.currentTime + .05);
  const types = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'];
  const type = types.find(x => window.MediaRecorder && MediaRecorder.isTypeSupported(x)) || '';
  const stream = new MediaStream([...cv.captureStream(30).getVideoTracks(), ...dest.stream.getAudioTracks()]);
  const mr = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 10e6 }), parts = [];
  mr.ondataavailable = e => e.data.size && parts.push(e.data);
  mr.onstop = async () => {
    g.disconnect();
    const ext = type.includes('mp4') ? 'mp4' : 'webm', blob = new Blob(parts, { type: type.split(';')[0] || 'video/webm' });
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = 'המחברות-שלי-מחברות.' + ext; a.className = 'btn p'; a.textContent = 'הורדה שוב';
    document.getElementById('dl').replaceChildren(a); if (!new URLSearchParams(location.search).get('save')) a.click();
    st.textContent = ext === 'mp4' ? 'הסרטון ירד ✓ (MP4)' : 'הסרטון ירד ✓ (WEBM: אם האפליקציה לא מקבלת, להמיר ל-MP4 באתר המרה)';
    btns.forEach(b => b.disabled = false);
    const save = new URLSearchParams(location.search).get('save');
    if (save && /^http:\/\/(127\.0\.0\.1|localhost):\d+\//.test(save)) fetch(save + '?ext=' + ext, { method: 'POST', body: blob }).then(() => { st.textContent += ' · נשמר'; }).catch(() => {});
  };
  st.textContent = 'מקליט... 18 שניות'; mr.start(250);
  play(() => mr.stop());
};
const ready = Promise.all([document.fonts.load('900 100px "Rubik"'), document.fonts.load('800 100px "Rubik"'), document.fonts.load('500 100px "Rubik"'), document.fonts.load('700 100px "Amatic SC"'), new Promise(r => { if (qrImg.complete) r(); else { qrImg.onload = r; qrImg.onerror = r; } })]).catch(() => {});
ready.then(() => frame(16.5));
