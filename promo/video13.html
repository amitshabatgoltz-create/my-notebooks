<h1>סרטון: הבננה שנכשלה (54 שניות, עם קולות)</h1>
<p>בננה שנכשלה פוגשת אגס מסודר, מגלה את "המחברות שלי", עוזרת לחבר – ובסוף גם המורה רוצה.</p>

<script>
const W = 1080, H = 1920, DUR = 54, FPS = 30;
// מי מדבר ומתי (בשניות מתחילת הסרטון) – הפה זז בזמן הזה
const VO = [['n1', .4, 3.7], ['b1', 4.5, 3.39], ['b2', 10.0, 2.56], ['p1', 12.9, 4.45], ['p2', 21.0, 2.41], ['b3', 23.6, 2.63], ['n2', 26.9, 1.14], ['b4', 29.1, .6], ['r1', 32.3, .84], ['b5', 33.5, 2.92], ['t1', 38.7, .79], ['b6', 39.9, 3.58], ['t2', 43.9, 2.18], ['n3', 47.0, 6.21]];

const prog = (t, a, d) => clamp((t - a) / d);

// ---------- אפקטים ----------

  ctx.fillStyle = '#FBFBF6'; ctx.fillRect(-s * .38, -s / 2, s * .76, s); ctx.shadowColor = 'transparent';

  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);

// ---------- דמויות (פירות "תלת-ממד": הצללה, הבהקה וצל) ----------
// kind: banana | pear | broc | apple. o: mood, outfit, glasses, armL/armR (זווית), sit, walk, glowC, tears, eyeX
function fruitPath(kind, s) {

    p.moveTo(-s * .05, -s * .62);
    p.bezierCurveTo(s * .2, -s * .55, s * .26, -s * .1, s * .2, s * .3);
    p.bezierCurveTo(s * .16, s * .5, -s * .02, s * .58, -s * .16, s * .5);
    p.bezierCurveTo(-s * .28, s * .4, -s * .26, s * .0, -s * .2, -s * .3);

    p.bezierCurveTo(s * .2, s * .02, s * .34, s * .12, s * .32, s * .3);
    p.bezierCurveTo(s * .3, s * .52, s * .12, s * .58, 0, s * .58);
    p.bezierCurveTo(-s * .12, s * .58, -s * .3, s * .52, -s * .32, s * .3);
    p.bezierCurveTo(-s * .34, s * .12, -s * .2, s * .02, -s * .18, -s * .1);
    p.bezierCurveTo(-s * .18, -s * .2, -s * .16, -s * .5, 0, -s * .5); p.closePath();

    p.moveTo(0, -s * .3);

    p.bezierCurveTo(s * .38, s * .36, s * .16, s * .56, 0, s * .48);
    p.bezierCurveTo(-s * .16, s * .56, -s * .38, s * .36, -s * .4, s * .02);
    p.bezierCurveTo(-s * .42, -s * .34, -s * .18, -s * .48, 0, -s * .3); p.closePath();

const FRUIT = {

  pear: { c0: '#F1FFB0', c1: '#C9DF4A', c2: '#7E9A1E', face: -.2 },
  apple: { c0: '#FF9C8C', c1: '#E5322D', c2: '#8E1515', face: -.04 },
  broc: { c0: '#D8F5B0', c1: '#9BD15A', c2: '#5D8F2A', face: .1 },

const OUTFIT = { rags: ['#6B6B73', '#45454D'], hoodie: ['#8B5CF6', '#5B3FD6'], suit: ['#2B3A67', '#1A2445'], red: ['#DC2626', '#991B1B'], tee: ['#9CA3AF', '#6B7280'] };
// צבעים: בהיר/כהה יותר
function shade(hex, a) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;

}
// יד/רגל כמו צינור תלת-ממדי: צל, צבע, והבהקה לאורך
function tube(x0, y0, x1, y1, w, col) {

  ctx.strokeStyle = shade(col, -.35); ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = w * .72; ctx.beginPath(); ctx.moveTo(x0 - w * .06, y0 - w * .06); ctx.lineTo(x1 - w * .06, y1 - w * .06); ctx.stroke();
  ctx.strokeStyle = shade(col, .45); ctx.globalAlpha = .7; ctx.lineWidth = w * .2; ctx.beginPath(); ctx.moveTo(x0 - w * .2, y0 - w * .2); ctx.lineTo(x1 - w * .2, y1 - w * .2); ctx.stroke(); ctx.globalAlpha = 1;

function char(kind, x, y, s, o = {}) {

      ctx.fillStyle = rgrad(cx - rd * .35, cy - rd * .4, rd * .05, rd * 1.1, [[0, '#A6E06A'], [.55, '#4F9A2E'], [1, '#1F4D14']]); ctx.beginPath(); ctx.arc(cx, cy, rd, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(30,70,15,.35)'; for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.arc(cx + (r() - .5) * rd, cy + (r() - .5) * rd, rd * .14, 0, 7); ctx.fill(); } }

  ctx.fillStyle = rgrad(-s * .12, -s * .28, s * .03, s * .85, [[0, F.c0], [.42, F.c1], [1, F.c2]]); ctx.fill(body);
  if (kind === 'banana') { ctx.save(); ctx.clip(body); ctx.strokeStyle = 'rgba(150,100,0,.18)'; ctx.lineWidth = s * .012; [-.1, .05].forEach(dx => { ctx.beginPath(); ctx.moveTo(dx * s, -s * .55); ctx.bezierCurveTo(dx * s + s * .18, -s * .2, dx * s + s * .12, s * .3, dx * s - s * .02, s * .55); ctx.stroke(); }); ctx.restore(); }
