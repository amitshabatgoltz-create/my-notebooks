    p.bezierCurveTo(-s * .12, s * .58, -s * .3, s * .52, -s * .32, s * .3);

  broc: { c0: '#D8F5B0', c1: '#9BD15A', c2: '#5D8F2A', face: .1 },

  [-1, 1].forEach(sd => {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(sd * s * .085, fy, eyeR, eyeR * 1.15 * (mood === 'shock' || mood === 'amazed' ? 1.25 : 1) * blink, 0, 0, 7); ctx.fill();
