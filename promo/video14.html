const W = 1080, H = 1920, FPS = 30, DUR = TL.dur;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const prog = (t, a, d) => clamp((t - a) / d);
const eOut = x => 1 - Math.pow(1 - x, 3);
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function font(size, w = 800) { ctx.font = `${w} ${size}px "Rubik"`; }
function grad(x0, y0, x1, y1, stops) { const g = ctx.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function rgrad(x, y, r0, r1, stops) { const g = ctx.createRadialGradient(x, y, r0, x, y, r1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function T(s, x, y, size, w = 800, color = '#fff', align = 'center') { font(size, w); ctx.direction = 'rtl'; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color; ctx.fillText(s, x, y); }
const YEL = '#FFD84D', PINK = '#EC4899', VIO = '#8B5CF6', GREEN = '#10B981';

// ---------- תמונות ----------
const IMG = {};
const load = n => new Promise(res => { const im = new Image(); im.onload = () => { IMG[n] = im; res(); }; im.onerror = () => res(); im.src = `v14/s${n}.jpg`; });
const ready = Promise.all([0, 1, 2, 3, 4, 5, 6, 7, 8].map(load).concat(['900', '800', '700'].map(w => document.fonts.load(`${w} 100px "Rubik"`).catch(() => {}))));
// מצלמה איטית על התמונה (זום/תזוזה) – fx,fy = נקודת מיקוד
function shot(n, t, d, o = {}) {
  const im = IMG[n] || IMG[0]; if (!im) { ctx.fillStyle = '#111'; ctx.fillRect(0, 0, W, H); return; }
  const k = clamp(t / d), z0 = o.z0 ?? 1.04, z1 = o.z1 ?? 1.16, z = lerp(z0, z1, eInOut(k)) * (o.punch || 1);
  const base = Math.max(W / im.width, H / im.height) * z, w = im.width * base, h = im.height * base;
  const fx = lerp(o.fx0 ?? .5, o.fx1 ?? .5, eInOut(k)), fy = lerp(o.fy0 ?? .5, o.fy1 ?? .5, eInOut(k));
  let x = W / 2 - fx * w, y = H / 2 - fy * h; x = Math.min(0, Math.max(W - w, x)); y = Math.min(0, Math.max(H - h, y));
  const sh = o.shake ? (Math.sin(t * 70) * o.shake) : 0;

}
// אווירה: כהה בקצוות, גוון צבע, גרעין
function grade(dark = .55, tint = null) {
  ctx.fillStyle = rgrad(W / 2, H * .45, H * .25, H * .8, [[0, 'rgba(0,0,0,0)'], [1, `rgba(0,0,0,${dark})`]]); ctx.fillRect(0, 0, W, H);
  if (tint) { ctx.fillStyle = tint; ctx.fillRect(0, 0, W, H); }
  ctx.fillStyle = grad(0, H * .62, 0, H, [[0, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,.65)']]); ctx.fillRect(0, H * .62, W, H * .38);
}
function grain(T0) { const r = rnd(Math.floor(T0 * 24) + 1); ctx.fillStyle = 'rgba(255,255,255,.05)'; for (let i = 0; i < 260; i++) ctx.fillRect(r() * W, r() * H, 2, 2); }

// ---------- כתוביות מילה אחרי מילה ----------
const SEGS = TL.segs.map(s => ({ ...s, chunks: (() => { const out = []; let cur = []; s.words.forEach((w, i) => { cur.push(i); const ends = /[.,?!:]$/.test(w[0]); if (cur.length >= 3 || ends || i === s.words.length - 1) { out.push(cur); cur = []; } }); return out; })() }));
const clean = w => w.replace(/[.,?!:…"]/g, '');
function captions(T0) {

  const ch = seg.chunks.find(c => c.includes(wi)) || seg.chunks[seg.chunks.length - 1];
  const words = ch.map(i => seg.words[i]); const size = 82;
  font(size, 900); const gap = 22, ws = words.map(w => ctx.measureText(w[0]).width), total = ws.reduce((a, b) => a + b, 0) + gap * (words.length - 1);
  let x = W / 2 + total / 2; const y = 1560;

  ctx.save(); ctx.translate(W / 2, y); ctx.scale(lerp(.85, 1, pk), lerp(.85, 1, pk)); ctx.translate(-W / 2, -y);

    ctx.save(); const cx = x - ws[j] / 2; ctx.translate(cx, y); const sc = cur ? 1.08 : 1; ctx.scale(sc, sc);
    font(size, 900); ctx.direction = 'rtl'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.lineWidth = 16; ctx.strokeStyle = 'rgba(0,0,0,.9)'; ctx.strokeText(w[0], 0, 0);
    ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 18; ctx.fillStyle = hi && spoken ? YEL : spoken ? '#fff' : 'rgba(255,255,255,.55)'; ctx.fillText(w[0], 0, 0);

// ---------- שעון גדול ----------
function clock(txt, t, y = 430) {

  font(150, 900); ctx.direction = 'ltr'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

// ---------- הודעה מהטלפון (כמו בטלפון אמיתי) ----------
function notif(t, t0, title, body, color = VIO) {
  const k = eOut(prog(t, t0, .45)); if (k <= 0) return;

}
// ---------- אפקטים ----------
function confetti(t, t0, cx, cy, n, seed) {

  for (let i = 0; i < n; i++) { const a = r() * Math.PI * 2, v = 500 + r() * 800, rot = r() * 10; const x = cx + Math.cos(a) * v * k, y = cy + Math.sin(a) * v * k - 300 * k + 1200 * k * k;

function viewfinder(t) {
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 8; const c = 90, m = 120;
  [[m, 380, 1, 1], [W - m, 380, -1, 1], [m, 1380, 1, -1], [W - m, 1380, -1, -1]].forEach(([x, y, dx, dy]) => { ctx.beginPath(); ctx.moveTo(x, y + dy * c); ctx.lineTo(x, y); ctx.lineTo(x + dx * c, y); ctx.stroke(); });
  ctx.fillStyle = '#EF4444'; ctx.beginPath(); ctx.arc(150, 300, 14, 0, 7); ctx.globalAlpha = Math.sin(t * 6) > 0 ? 1 : .3; ctx.fill(); ctx.globalAlpha = 1;
  T('REC', 235, 302, 38, 800, '#fff'); ctx.restore();

// ---------- מסך הטלפון מקרוב ----------
const TYPED = ['מחזור המים', '1. אידוי – השמש מחממת את המים', '2. עיבוי – נוצרים עננים', '3. משקעים – גשם ושלג', '4. זרימה – המים חוזרים לים'];
function phoneUI(t, T0) {
  const PW = 680, PH = 1260, px = 540, py = 860;
  ctx.save(); ctx.translate(px, py); ctx.rotate(Math.sin(T0 * 1.2) * .012); const zs = lerp(.94, 1.02, eOut(prog(t, 0, 9))); ctx.scale(zs, zs);
  ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 70; ctx.shadowOffsetY = 30;
  rr(-PW / 2, -PH / 2, PW, PH, 76); ctx.fillStyle = '#121218'; ctx.fill(); ctx.shadowColor = 'transparent';
  rr(-PW / 2 + 4, -PH / 2 + 4, PW - 8, PH - 8, 72); ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 4; ctx.stroke();
  const sx = -PW / 2 + 22, sy = -PH / 2 + 22, sw = PW - 44, sh = PH - 44;

  ctx.fillStyle = '#F7F6FB'; ctx.fillRect(sx, sy, sw, sh);
  ctx.fillStyle = grad(sx, 0, sx + sw, 0, [[0, '#6D5EFC'], [1, PINK]]); ctx.fillRect(sx, sy, sw, 160);
  T('המחברות שלי', sx + sw - 44, sy + 98, 46, 900, '#fff', 'right');
  // הצילום של הלוח למעלה
  ctx.save(); rr(sx + 36, sy + 200, sw - 72, 230, 22); ctx.clip(); const im = IMG[3]; if (im) { const cw = im.width * .5, chh = cw * 230 / (sw - 72); ctx.drawImage(im, im.width * .5, im.height * .3, cw, chh, sx + 36, sy + 200, sw - 72, 230); } ctx.restore();

    if (k < 1 && Math.sin(T0 * 14) > 0) { font(i ? 34 : 46, 600); const w = ctx.measureText(part).width; ctx.fillStyle = '#4F46E5'; ctx.fillRect(sx + sw - 56 - w, lineY + i * 74 - 22, 4, 44); }
  });

  if (bk > 0) { ctx.save(); ctx.translate(0, sy + 960); const sc = eBack(bk) * (1 - tap * .08); ctx.scale(sc, sc);
    ctx.shadowColor = 'rgba(236,72,153,.6)'; ctx.shadowBlur = 40; rr(-240, -64, 480, 128, 64); ctx.fillStyle = grad(-240, 0, 240, 0, [[0, VIO], [1, PINK]]); ctx.fill(); ctx.shadowColor = 'transparent';
    T('סיכום למבחן', 0, 4, 52, 900, '#fff'); ctx.restore(); }
  if (t > 5.4 && t < 6.9) { const fk = eOut(prog(t, 5.4, .7)); ctx.save(); ctx.translate(lerp(250, 70, fk), lerp(sy + 1200, sy + 1000, fk)); ctx.fillStyle = 'rgba(255,214,170,.96)'; ctx.beginPath(); ctx.ellipse(0, 0, 50, 64, -.4, 0, 7); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.ellipse(-13, -26, 15, 10, -.4, 0, 7); ctx.fill(); ctx.restore(); }
  const sk = eOut(prog(t, 6.5, .6));

    rr(sx + 18, sy + 300, sw - 36, sh - 320, 44); ctx.fillStyle = '#fff'; ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 40; ctx.fill(); ctx.shadowColor = 'transparent';
    rr(sx + 18, sy + 300, sw - 36, 130, 44); ctx.fillStyle = grad(sx, 0, sx + sw, 0, [[0, '#FDE68A'], [1, '#FBCFE8']]); ctx.fill();
    T('סיכום למבחן', sx + sw - 64, sy + 366, 52, 900, '#1E1B4B', 'right');
    ['אידוי: מים ← אדים', 'עיבוי: אדים ← עננים', 'משקעים: עננים ← גשם', 'זרימה: חזרה לים'].forEach((l, i) => {
      const lk = prog(t, 6.9 + i * .22, .3); if (lk <= 0) return; const yy = sy + 520 + i * 110;
      ctx.save(); ctx.globalAlpha = lk; ctx.beginPath(); ctx.arc(sx + sw - 86, yy, 24, 0, 7); ctx.fillStyle = GREEN; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(sx + sw - 98, yy); ctx.lineTo(sx + sw - 88, yy + 10); ctx.lineTo(sx + sw - 73, yy - 9); ctx.stroke();
      T(l, sx + sw - 130, yy, 38, 700, '#2A2A3A', 'right'); ctx.restore();

}

// ---------- סצנות ----------
const SCN = {
  1: (t, d, T0) => { shot(1, t, d, { z0: 1.05, z1: 1.22, fx0: .5, fy0: .5, fx1: .55, fy1: .42 }); grade(.6, 'rgba(10,20,50,.25)'); clock('07:20', t); },
  2: (t, d, T0) => { shot(2, t, d, { z0: 1.06, z1: 1.18, fx0: .35, fy0: .45, fx1: .7, fy1: .4 }); grade(.45); },
