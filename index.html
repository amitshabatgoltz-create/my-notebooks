<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>המחברות שלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
</head>
<body>

<!-- ===== מסך כניסה ===== -->
<section id="login">
  <button class="theme-btn login-theme" data-theme-toggle title="לבן / כהה">🌙</button>
  <div class="login-card">
    <div class="logo">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M9 7h7M9 11h5"/></svg>
    </div>
    <h1>המחברות שלי</h1>
    <p>כל המחברות שלך, בכל מחשב ובכל טלפון</p>

    <div class="tabs">
      <button id="tabLogin" class="on" type="button">כניסה</button>
      <button id="tabSignup" type="button">הרשמה</button>
    </div>

    <form id="authForm" novalidate>
      <label class="field hidden" id="nameField"><span>שם</span><input id="name" autocomplete="name"></label>
      <label class="field"><span>אימייל</span><input id="email" type="email" autocomplete="email" dir="ltr" required></label>
      <label class="field"><span>סיסמה</span><input id="password" type="password" autocomplete="current-password" dir="ltr" required></label>
      <button class="btn btn-primary" id="authBtn" type="submit">כניסה</button>
    </form>
    <button class="link" id="forgotBtn" type="button">שכחתי סיסמה</button>

    <div class="or">או</div>
    <button class="btn btn-google" id="googleBtn" type="button">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      כניסה עם Google
    </button>
    <div class="status" id="loginStatus"></div>
  </div>
</section>

<!-- ===== האפליקציה ===== -->
<div id="app" class="hidden">
  <header>
    <div class="bar">
      <div class="brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        המחברות שלי
      </div>
      <nav class="nav">
        <button id="navNotes" class="on">📓 מחברות</button>
        <button id="navCal">📅 יומן</button>
      </nav>
      <span class="who" id="who"></span>
      <button class="theme-btn" data-theme-toggle title="לבן / כהה">🌙</button>
      <button class="btn btn-ghost" id="logoutBtn">יציאה</button>
    </div>
  </header>

  <main>
    <section id="library">
      <div class="lib-head">
        <div>
          <h2>כל המחברות</h2>
          <div class="sub" id="count"></div>
        </div>
        <button class="btn btn-primary" id="newBtn">+ מחברת חדשה</button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="empty hidden" id="loading">טוען את המחברות...</div>
      <div class="empty hidden" id="sample">
        אין לך עדיין מחברות.
        <button class="link" id="sampleBtn">להוסיף את "מחברת תנ"ך" כדוגמה?</button>
      </div>
    </section>

    <section id="notebook" class="hidden">
      <div class="ed-top">
        <button class="btn btn-ghost" id="backBtn">→ חזרה למחברות</button>
        <input class="ed-title" id="title" aria-label="שם המחברת">
        <span class="save" id="save"></span>
        <button class="btn btn-ghost" id="delBtn" title="מחיקת מחברת">🗑 מחיקה</button>
      </div>
      <div class="toolbar" id="toolbar">
        <button data-cmd="h1" title="כותרת ראשית"><b>כותרת</b></button>
        <button data-cmd="h2" title="כותרת משנה">כותרת משנה</button>
        <button data-cmd="h3" title="כותרת קטנה">כותרת קטנה</button>
        <button data-cmd="p" title="טקסט רגיל">טקסט</button>
        <span class="sep"></span>
        <button data-cmd="bold" title="מודגש"><b>B</b></button>
        <button data-cmd="underline" title="קו תחתון"><u>U</u></button>
        <button data-cmd="mark" title="מרקר">🖍</button>
        <span class="sep"></span>
        <button data-cmd="ul" title="רשימה">• רשימה</button>
        <button data-cmd="ol" title="רשימה ממוספרת">1. רשימה</button>
        <span class="sep"></span>
        <button data-cmd="undo" title="בטל">↶</button>
        <button data-cmd="redo" title="בצע שוב">↷</button>
        <span class="sep"></span>
        <button id="imgBtn" type="button" title="הוספת תמונה">🖼 תמונה</button>
        <button id="tableBtn" type="button" title="טבלה">▦ טבלה</button>
        <input id="imgInput" type="file" accept="image/*" multiple hidden>
      </div>
      <div class="page"><div id="editor" contenteditable="true" spellcheck="true"></div></div>
    </section>
    <section id="calendar" class="hidden">
      <div class="cal-head">
        <button class="btn btn-ghost" id="prevMonth" title="חודש קודם">→</button>
        <h2 id="monthTitle"></h2>
        <button class="btn btn-ghost" id="nextMonth" title="חודש הבא">←</button>
        <button class="btn btn-ghost" id="todayBtn">היום</button>
      </div>
      <div class="cal-layout">
        <div class="cal-box">
          <div class="cal-grid cal-days"><div>א'</div><div>ב'</div><div>ג'</div><div>ד'</div><div>ה'</div><div>ו'</div><div>ש'</div></div>
          <div class="cal-grid" id="calGrid"></div>
          <div class="legend"><span><i class="dot t-test"></i>מבחן</span><span><i class="dot t-hw"></i>שיעורי בית</span><span><i class="dot t-event"></i>אירוע</span><span><i class="dot t-other"></i>אחר</span></div>
        </div>
        <aside class="day-panel">
          <h3 id="dayTitle"></h3>
          <div id="dayList"></div>
          <form id="evForm" class="ev-form">
            <input id="evTitle" placeholder="מה יש ביום הזה? למשל: מבחן בתנ״ך" required>
            <div class="ev-row">
              <select id="evType">
                <option value="test">מבחן</option>
                <option value="hw">שיעורי בית</option>
                <option value="event">אירוע</option>
                <option value="other">אחר</option>
              </select>
              <input id="evTime" type="time" title="שעה (לא חובה)">
              <button class="btn btn-primary" type="submit">הוספה</button>
            </div>
          </form>
          <h3 class="up-title">מה מחכה לי</h3>
          <div id="upcoming"></div>
        </aside>
      </div>
    </section>
  </main>
</div>

<div id="dialogRoot"></div>

<script type="module" src="app.js"></script>
</body>
</html>
