<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>הדף לא נמצא – המחברות שלי</title>
<link rel="icon" href="/my-notebooks/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBFBFD;--ink:#1D1D1F;--muted:#5F5F6B;--accent:#5E5CE6;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0E0E12;--ink:#F2F2F6;--muted:#A3A3AF;--accent:#8E8CFF;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:'Rubik',system-ui,sans-serif;text-align:center;padding:24px}
.logo{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;background:var(--accent);color:#fff;margin:0 auto 18px}
.logo svg{width:38px;height:38px}
h1{font-size:28px;margin:0 0 8px}
p{color:var(--muted);margin:0 0 24px;font-size:17px}
a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;border-radius:999px;background:var(--accent);color:#fff;text-decoration:none;font-weight:800;font-size:16px}
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 21.5A2.5 2.5 0 0 1 6.5 19H20v3H6.5"/></svg></div>
  <h1>אופס, הדף הזה לא קיים</h1>
  <p>אולי הקישור השתנה. כל המחברות שלך מחכות באתר.</p>
  <a href="/my-notebooks/">לאתר המחברות שלי</a>
</main>
</body>
</html>
